      summary: Resolve a podcast pointer to canonical IDs without creating a job
      security:
        - apiKeyBearer: []
      description: >-
        Resolves an Apple Podcasts episode URL, or an RSS `feed_url` plus
        `guid`, to canonical `episode_id`/`show_id` without creating a job. Exactly one of `url` or (`feed_url` and `guid`)
        must be supplied; OpenAPI parameter schemas cannot express that
        cross-parameter rule, so a request supplying neither, both, or a
        partial pair is rejected at runtime with `400 invalid_request` (out
        of scope for this document per its "runtime request validation
        middleware" exclusion). Spotify, YouTube, and raw-audio inputs return
        `422 source_not_supported`.
      parameters:
