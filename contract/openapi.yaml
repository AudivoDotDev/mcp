  /v1/logs:
    get:
      operationId: listRequestLogs
      tags: [Account]
      summary: The account's recent API requests and what each one cost
      security:
        - dashboardJwt: []
      description: >-
        One entry per request the account made: when it arrived, the endpoint
        it called, how it ended, and the credits it was charged. Newest first,
        paged with `limit` and `cursor`.


        **`credits_charged` is what was actually spent, never what was held.**
        A request that submits work answers `202` having reserved a ceiling and
        spent nothing, and its charge is written later, when the job settles —
        so the figure here starts at `0` and grows as the work lands. It never
        falls: a reservation that is released is never charged. `charge_pending`
        is `true` for exactly those requests, so a zero that is about to change
        is distinguishable from a request that was free. Every figure is the
        same ledger `GET /v1/usage` reports from, so the two pages cannot
        disagree about one request.


        **`omitted` says what this log cannot show.** Requests refused at the
        edge — an unrecognized or revoked API key, and the per-minute rate
        limit — never reach the API, and the component that refuses them
        authenticates with a single read and writes nothing, so no record of
        them exists. Their absence is stated rather than left to be discovered.


        Entries are retained for 30 days and then expire.
      parameters:
        - $ref: '#/components/parameters/LimitQueryParam'
        - $ref: '#/components/parameters/CursorQueryParam'
      responses:
        '200':
          description: One page of the account's recent requests, newest first.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestLogListResponse'
              examples:
                logs:
                  $ref: '#/components/examples/RequestLogListExample'
        '400':
          $ref: '#/components/responses/BadRequestDashboard'
        '401':
          $ref: '#/components/responses/UnauthorizedDashboard'
        '429':
          $ref: '#/components/responses/TooManyRequestsDashboard'
        '500':
          $ref: '#/components/responses/InternalErrorDashboard'
  /v1/billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [Billing]
      summary: Create a Stripe Checkout session
      security:
        - dashboardJwt: []
      description: >-
        Creates a Stripe Checkout session for one paid tier and answers with
        the URL to send the customer to. The caller names a *tier*; the
        price behind it is resolved server-side from the stable Stripe lookup
        key, never sent by the caller — see `CheckoutRequest`
        for why. Plan switching is rate-limited to prevent grant farming.


        **Checkout is an external redirect.** The customer leaves for Stripe
        entirely and returns to a dashboard URL this operation names; nothing
        about the account changes here. Credits and the tier move only when the
        payment's webhook arrives, which is what makes a completed payment grant
        exactly once however many times it is delivered.


        The account's Stripe customer is created here, on first use, replacing
        the placeholder a signup writes. That call is idempotent on the
        account, so two clicks — or two concurrent requests — converge on one
        customer rather than minting a second.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
            examples:
              startupPlan:
                value:
                  tier: startup
      responses:
        '200':
          description: A Checkout session URL.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
              examples:
                session:
                  $ref: '#/components/examples/CheckoutExample'
        '400':
          $ref: '#/components/responses/BadRequestDashboard'
        '401':
          $ref: '#/components/responses/UnauthorizedDashboard'
        '409':
          $ref: '#/components/responses/ConflictBillingCheckout'
        '429':
          $ref: '#/components/responses/TooManyRequestsDashboard'
        '500':
          $ref: '#/components/responses/InternalErrorDashboard'
  /v1/billing/portal:
    post:
      operationId: createPortalSession
      tags: [Billing]
      summary: Create a Stripe Customer Portal session
      security:
        - dashboardJwt: []
      description: >-
        Customer Portal session with tested cancellation behavior: renewal
        stops immediately while paid-period access is preserved unless the
        customer explicitly requests eligible immediate termination.


        The session is always scoped to the caller's own Stripe customer, taken
        from the account row the authorizer resolved and never from the
        request: there is no field here a caller could send that would open
        somebody else's billing.


        **A `suspended` account may still open the portal, and that is
        deliberate.** A hold is a billing problem, and this is the page that
        settles it; refusing the portal to the customer who most needs it would
        leave no route out of the hold. A closed account is refused, because
        there is nothing left to manage.
      responses:
        '200':
          description: A Customer Portal session URL.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalResponse'
              examples:
                session:
                  $ref: '#/components/examples/PortalExample'
        '401':
          $ref: '#/components/responses/UnauthorizedDashboard'
        '409':
          $ref: '#/components/responses/ConflictBillingPortal'
        '429':
          $ref: '#/components/responses/TooManyRequestsDashboard'
        '500':
          $ref: '#/components/responses/InternalErrorDashboard'
  /v1/billing/invoices:
    get:
      operationId: listInvoices
      tags: [Billing]
      summary: Normalized invoice/payment history
      security:
        - dashboardJwt: []
      description: >-
        The caller's own invoices, newest first, paged with `limit` and
        `cursor`. An account that has never paid for anything has an empty
        page rather than an error — including one still carrying the placeholder
        customer a signup writes, which has no Stripe history to read.


        Draft invoices are not listed. A draft is an invoice Stripe has not
        issued yet; showing one would put a figure on a billing page that
        nobody owes and that can still change.


        A read, so it stays open in every account state: a suspended or closed
        customer needs their receipts more than an active one does.
      parameters:
        - $ref: '#/components/parameters/LimitQueryParam'
        - $ref: '#/components/parameters/CursorQueryParam'
      responses:
        '200':
          description: A page of invoices.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicesListResponse'
              examples:
                onePage:
                  $ref: '#/components/examples/InvoicesListExample'
        '400':
          $ref: '#/components/responses/BadRequestDashboard'
        '401':
          $ref: '#/components/responses/UnauthorizedDashboard'
        '429':
          $ref: '#/components/responses/TooManyRequestsDashboard'
        '500':
          $ref: '#/components/responses/InternalErrorDashboard'
  /v1/billing/address:
    get:
      operationId: getBillingAddress
      tags: [Billing]
      summary: The account's stored billing address
      security:
        - dashboardJwt: []
      description: >-
        The billing address this account has saved, or `null` when it has
        saved none.


        **It is read from the account, not from Stripe.** The settings form
        reads this back on every visit, and an account that has never checked
        out has no Stripe customer to read from — so the address is stored on
        the account row, where it exists whether or not the customer has ever
        paid, and where it does not cost a third-party round trip to render a
        form.


        A read, so it stays open in every account state.
      responses:
        '200':
          description: The stored billing address, or `null`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAddressResponse'
              examples:
                stored:
                  $ref: '#/components/examples/BillingAddressExample'
        '401':
          $ref: '#/components/responses/UnauthorizedDashboard'
        '429':
          $ref: '#/components/responses/TooManyRequestsDashboard'
        '500':
          $ref: '#/components/responses/InternalErrorDashboard'
    put:
      operationId: updateBillingAddress
      tags: [Billing]
      summary: Store the account's billing address
      security:
        - dashboardJwt: []
      description: >-
        Replaces the stored billing address with the one sent. A whole
        address, not a patch: a partial update of a postal address is how a
        customer who moves from a country with states to one without ends up
        with a province that is no longer theirs.


        What Stripe holds is collected separately, at Checkout, and applies to
        the invoice being paid. This is the account's own record and what the
        settings form renders.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BillingAddress'
            examples:
              address:
                value:
                  line1: 1 Market Street
                  line2: Floor 6
                  city: San Francisco
                  state: CA
                  postal_code: '94105'
                  country: US
      responses:
        '200':
          description: The address as it is now stored.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAddressResponse'
              examples:
                stored:
                  $ref: '#/components/examples/BillingAddressExample'
        '400':
          $ref: '#/components/responses/BadRequestDashboard'
        '401':
          $ref: '#/components/responses/UnauthorizedDashboard'
        '409':
          $ref: '#/components/responses/ConflictAccountStateDashboard'
        '429':
          $ref: '#/components/responses/TooManyRequestsDashboard'
        '500':
          $ref: '#/components/responses/InternalErrorDashboard'
  /v1/billing/auto-recharge:
    get:
      operationId: getAutoRecharge
      tags: [Billing]
      summary: Whether this account tops itself up, and on what terms
      security:
        - dashboardJwt: []
      description: >-
        The account's auto-recharge setting and the figures it would use.


        **The figures are per tier and not chosen by the caller.** The threshold
        is a tenth of the tier's included allowance and the top-up is one more
        month of it at that month's price, so the same rule reads sensibly from
        a 1,200-credit plan to a 30,000-credit one, where any flat number would
        be a rounding error at one end and the whole allowance at the other. It
        also means a top-up needs no Stripe product that a subscription does not
        already have.


        `available` is false on the free tier, whose grant is one-time and which
        has no price to charge; every figure is then `null`.


        `failure` carries the provider's decline code and when it happened, and
        nothing else — the message beside it at Stripe quotes the card. A
        recorded failure also *pauses* auto-recharge, because an account below
        its floor would otherwise re-present a dead card on every confirm; the
        customer clears it by switching the setting back on.


        A read, so it stays open in every account state.
      responses:
        '200':
          description: The setting and its terms.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoRechargeResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedDashboard'
        '429':
          $ref: '#/components/responses/TooManyRequestsDashboard'
        '500':
          $ref: '#/components/responses/InternalErrorDashboard'
    put:
      operationId: updateAutoRecharge
      tags: [Billing]
      summary: Turn auto-recharge on or off
      security:
        - dashboardJwt: []
      description: >-
        Switches auto-recharge on or off. Switching it on also clears a
        recorded decline, which is how a customer retries after fixing their
        card.


        Refused with `invalid_request` on a tier that has no price to charge.


        **Turning this on does not rescue the request that trips the floor.** A
        card charge and its round trip do not fit inside a request's budget, so
        the confirm that crosses the threshold is still refused for insufficient
        credit and the top-up lands behind it. What this buys is that the *next*
        request finds the credit there.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [enabled]
              properties:
                enabled:
                  type: boolean
                  description: Whether the account should top itself up.
            examples:
              on:
                value: { enabled: true }
      responses:
        '200':
          description: The setting as it now stands.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoRechargeResponse'
        '400':
          $ref: '#/components/responses/BadRequestDashboard'
        '401':
          $ref: '#/components/responses/UnauthorizedDashboard'
        '409':
          $ref: '#/components/responses/ConflictAccountStateDashboard'
        '429':
          $ref: '#/components/responses/TooManyRequestsDashboard'
        '500':
          $ref: '#/components/responses/InternalErrorDashboard'
  /v1/billing/refund:
    post:
      operationId: requestRefund
      tags: [Billing]
      summary: Refund an eligible unused paid-credit lot
      security:
        - dashboardJwt: []
      description: >-
        **Declared, not routed.** No deployed method answers this
        operation yet: Stripe runs in test mode and no real money has moved,
        and the refund policy text it depends on is not written. The shape
        stands so a client can be built against it; a call today reaches
        the edge's own 403 for an unmapped method, not this API's error envelope.


        Refunds only unused, unexpired, refundable paid-credit lots, to their
        originating Stripe charge and currency. Free, promotional, and
        consumed credits are never cash-refunded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
            examples:
              refund:
                value:
                  credit_lot_id: lot_9f2c7a1b3d4e
      responses:
        '200':
          description: The refund outcome.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefundResponse'
              examples:
                refunded:
                  $ref: '#/components/examples/RefundExample'
        '400':
          $ref: '#/components/responses/BadRequestDashboard'
        '401':
          $ref: '#/components/responses/UnauthorizedDashboard'
        '404':
          $ref: '#/components/responses/NotFoundDashboard'
        '422':
          $ref: '#/components/responses/UnprocessableDashboard'
        '429':
          $ref: '#/components/responses/TooManyRequestsDashboard'
  /v1/data/export:
    post:
      operationId: exportAccountData
      tags: [Data]
      summary: Export the account's portable data
      security:
        - dashboardJwt: []
      description: >-
        Generates the paid-beta account export and returns an expiring
        download.


        The document holds the account's own record — its profile, its API key
        *metadata* (never a secret, which is not stored), its credit lots, its
        ledger events and its request log — read through the same access
        patterns the dashboard's own pages read, so it introduces no view of an
        account that did not already exist.


        `download_url` is a presigned URL to a private object and is the only
        thing that can reach it: the bucket blocks public access, the object
        carries no ACL, and the signature expires in **minutes**, not the 24
        hours an oversized transcript's delivery URL is given. The whole of an
        account's record is a different object from one episode's transcript,
        and it is treated as one. Past `expires_at` the link is refused, and
        the object itself is expired by a lifecycle rule shortly after; ask
        again to get a fresh one.


        Refused on an account that is being deleted or is deleted: the records
        retained after a deletion are kept to answer a refund or a dispute, not
        to be read back by a session that outlived the account.
      responses:
        '200':
          description: An expiring download link for the export.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataExportResponse'
              examples:
                export:
                  $ref: '#/components/examples/DataExportExample'
        '401':
          $ref: '#/components/responses/UnauthorizedDashboard'
        '409':
          $ref: '#/components/responses/ConflictAccountStateDashboard'
        '429':
          $ref: '#/components/responses/TooManyRequestsDashboard'
        '500':
          $ref: '#/components/responses/InternalErrorDashboard'
  /v1/data:
    delete:
      operationId: deleteAccountData
      tags: [Data]
      summary: Delete the account and account-linked data
      security:
        - dashboardJwt: []
      description: >-
        Revokes access and deletes account-linked data under the disclosed
        retention/shared-cache policy. Does not promise deletion of a shared
        public-podcast cache object still used by other accounts.


        **Every API key is revoked before anything is removed**, and the
        account's API Gateway key is deleted with them, so no credential
        outlives the records it could have reached. The dashboard sign-in is
        deleted too, which is what makes the same address able to sign up
        again — as a new account, with no free grant, because the marker that
        fences one grant per address is a keyed hash that names nobody and
        survives.


        **Unspent paid credits are forfeited.** The credit lots and the ledger
        events are retained so a refund or a payment dispute can still be
        answered, and they stay keyed to the deleted account: a later signup
        derives a new account id from a new sign-in identity and can never
        reach them. Refund an unused balance *before* deleting if you want it
        back.


        Idempotent: deleting an account that is already deleted returns the
        same receipt rather than an error, and a deletion interrupted part way
        is finished by calling again.
      responses:
        '200':
          description: The deletion receipt.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataDeletionReceipt'
              examples:
                receipt:
                  $ref: '#/components/examples/DataDeletionExample'
        '400':
          $ref: '#/components/responses/BadRequestDashboard'
        '401':
          $ref: '#/components/responses/UnauthorizedDashboard'
        '409':
          $ref: '#/components/responses/ConflictAccountStateDashboard'
        '429':
          $ref: '#/components/responses/TooManyRequestsDashboard'
        '500':
          $ref: '#/components/responses/InternalErrorDashboard'
components:
  securitySchemes:
    apiKeyBearer:
      type: http
      scheme: bearer
      bearerFormat: 'hk_live_... or hk_test_...'
      description: >-
        `Authorization: Bearer hk_live_...` for live keys or `Authorization:
        Bearer hk_test_...` for test-mode keys. `hk_test_` keys resolve real
        public catalog metadata but return deterministic committed fixtures,
        never call inference, and never mutate live credits. This is the *only* transport for the
        credential: the `x-api-key` alias once documented was removed in 0.2.0, because the edge authorizer
        reads `Authorization` as its single identity source and a request on
        any other header is refused before it is authenticated.


        Never accepted on a `dashboardJwt` operation, and there are no
        exceptions. `GET /v1/usage` and `GET /v1/limits` briefly declared both
        schemes (0.8.0); that was withdrawn in 0.8.1 because no deployed route
        could honor it — both operations are served by the control-plane API,
        whose authorizer verifies a Cognito token and refuses an `hk_live_`
        credential on shape, and the customer API does not route either path.
        An API-key holder reads its balance and reservation from
        `QuoteResponse`, which carries `balance_credits` and
        `reserved_credits` on every quote. Every operation in this document
        takes one scheme or the other and refuses the wrong one as
        `unauthenticated`.
    dashboardJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        A Cognito access token, issued through the dashboard's own sign-up and
        sign-in pages (a backend-for-frontend; there is no Cognito Hosted UI)
        and sent as `Authorization: Bearer <jwt>`. Dashboard operations require
        this scheme and cannot be
        called with an API key, with no exception. `GET /v1/usage` and
        `GET /v1/limits` offered both schemes from 0.8.0; 0.8.1 withdrew that,
        because the control-plane API serves them alone and its authorizer has
        no API-key branch. An `account_id` supplied
        by the client is ignored; all reads/writes are scoped server-side to
        the authenticated account.
  parameters:
    JobIdPathParam:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/JobId'
    ReadIdPathParam:
      name: read_id
      in: path
      required: true
      description: >-
        The id a settled transcript read was charged under — a
        `cached_read` group member's `read_id`, or a completed job's
        `job_id`. Job-shaped: the two are minted from one
        generator, so one read is one id whichever way the transcript was
        obtained.
      schema:
        $ref: '#/components/schemas/JobId'
    ShowIdPathParam:
      name: show_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/ShowId'
    EpisodeIdPathParam:
      name: episode_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/EpisodeId'
    KeyIdPathParam:
      name: key_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/KeyId'
    OAuthRequestIdPathParam:
      name: request_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/OAuthRequestId'
    GrantIdPathParam:
      name: grant_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GrantId'
    QuoteIdPathParam:
      name: quote_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/QuoteId'
    GroupIdPathParam:
      name: group_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/GroupId'
    LimitQueryParam:
      name: limit
      in: query
      required: false
      description: Maximum number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    CursorQueryParam:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor from a previous page's `next_cursor`.
      schema:
        $ref: '#/components/schemas/Cursor'
    ShowFeedUrlQueryParam:
      name: feed_url
      in: query
      required: true
      description: >-
        The show's feed URL, as `GET /v1/search/shows` and `GET /v1/charts`
        return it. Required because a `show_id` is a one-way derivation and cannot be resolved back to a feed: the id names the
        show, and this names where to read it. The two must agree — the
        handler re-derives the id from `feed_url` and `itunes_id` and refuses
        the request when it does not match the path, so the id in the URL
        stays a canonical identifier rather than decoration, and a caller
        cannot point one show's id at another show's feed.
      schema:
        $ref: '#/components/schemas/FeedUrl'
    ShowItunesIdQueryParam:
      name: itunes_id
      in: query
      required: false
      description: >-
        The show's Apple collection id when the discovery surface returned
        one. It changes how `show_id` derives, so a show that has
        one must send it or the re-derivation above will not match.
      schema:
        type: integer
        minimum: 1
    SearchQueryParam:
      name: q
      in: query
      required: true
      description: Free-text show search query.
      schema:
        type: string
        minLength: 1
        maxLength: 200
    ChartCategoryQueryParam:
      name: category
      in: query
      required: true
      description: A provider category name, e.g. `Business` or `Society & Culture`; filtered server-side.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    ChartSizeQueryParam:
      name: size
      in: query
      required: false
      description: >-
        How many shows the caller wants. Clamped to the account tier's chart
        cap, never rejected for exceeding it; the response's `size`
        says what was asked and what was allowed.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    ChartLanguageQueryParam:
      name: language
      in: query
      required: false
      description: Restrict the chart to shows in one language, as a BCP-47 tag.
      schema:
        $ref: '#/components/schemas/Language'
    FormatQueryParam:
      name: format
      in: query
      required: false
      description: >-
        The derived output to return once the transcript is available, and
        with it the response media type: `json` →
        `application/json`, `text` → `text/plain`, `srt` →
        `application/x-subrip`, `vtt` → `text/vtt`, `md` → `text/markdown`.
        An oversized payload is `application/json` in every format — the one
        documented content-type switch, described on each operation.
        Delivering content is the whole point of the operations that use
        this parameter, so omitting it defaults to `json` rather than
        withholding the transcript (contrast `PollFormatQueryParam`, which
        has no default).


        Delivery-only: never affects the cache key or the produced transcript
        content.
      schema:
        $ref: '#/components/schemas/TranscriptFormat'
        default: json
    PollFormatQueryParam:
      name: format
      in: query
      required: false
      description: >-
        The derived output to return from `GET /v1/transcripts/{job_id}`.
        **No default** — deliberately not `FormatQueryParam`, which defaults
        to `json` on the operations where delivering content is the whole
        point of the call. Polling is different: the status-only option
        exists precisely so a caller can ask for state without shipping the
        transcript, and a default would make
        omitting `format` and passing `format=json` the same request,
        erasing that option. So: omit `format` entirely for status only —
        `application/json`, the job status object, `artifact` never present,
        whatever `status` is. Pass `format=json` explicitly to also receive
        the transcript once `status` is `completed` — the same status
        object, now with `artifact`. Pass `format=text|srt|vtt|md` to
        receive the raw artifact under its own media type (`text/plain`,
        `application/x-subrip`, `text/vtt`, `text/markdown`) once
        `completed`; against a job that has not reached `completed`, any
        non-status `format` is `409 job_not_completed`.


        Delivery-only: never affects the cache key or the produced transcript
        content.
      schema:
        $ref: '#/components/schemas/TranscriptFormat'
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Account-scoped for 24 hours; stores a canonical request-body hash.
        Reuse with a different body returns `409 idempotency_conflict`; a
        repeat while the original request is still running returns
        `409 request_in_progress` (retry with the same key). This is
        separate from the cache lease used to coalesce inference.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[!-~]{1,255}$'
    RequiredIdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        As `IdempotencyKeyHeader`, but required: a confirm spends up to a
        whole selection's ceiling, and a retry that could not be recognized
        as one would spend it twice. Missing is
        `400 invalid_request`.
      schema:
        type: string
        minLength: 1
        maxLength: 255
        pattern: '^[!-~]{1,255}$'
    ResolveUrlQueryParam:
      name: url
      in: query
      required: false
      description: An Apple Podcasts episode URL. Mutually exclusive with `feed_url`/`guid`.
      schema:
        $ref: '#/components/schemas/PodcastUrl'
    ResolveFeedUrlQueryParam:
      name: feed_url
      in: query
      required: false
      description: An RSS feed URL. Requires `guid`. Mutually exclusive with `url`.
      schema:
        $ref: '#/components/schemas/FeedUrl'
    ResolveGuidQueryParam:
      name: guid
      in: query
      required: false
      description: An episode GUID from the feed named by `feed_url`.
      schema:
        $ref: '#/components/schemas/EpisodeGuid'
  headers:
    XRequestId:
      description: >-
        Echoed on every response, success or error.
        A refusal generated at the edge (401, 429, and the unmetered-key 500)
        carries API Gateway's own hyphenated request id after the `req_`
        prefix; a response from a function carries the same id without
        hyphens.
      schema:
        type: string
        pattern: '^req_[A-Za-z0-9-]+$'
        maxLength: 100
    # -------------------------------------------------------------------
    # Rate-limit headers. `X-RateLimit-Limit` is the only one of the usual
    # trio this API sends, and that is a statement about where the limit is
    # enforced rather than an oversight: per-account throttling is an API
    # Gateway usage plan in front of the functions, so the ceiling is known
    # per request and the live counter is not visible to anything that could
    # put it on a response. `X-RateLimit-Remaining` and `X-RateLimit-Reset`
    # are therefore not declared at all — a header a client is told to size
    # its request rate from is worse invented than absent.
    XRateLimitLimit:
      description: >-
        The caller's requests-per-minute ceiling for the current tier. Present on every response for a resolved caller, success
        and error alike; absent from `401 unauthenticated`, which has no
        account to report a ceiling for, and from the edge's own `429`, which
        is emitted before any function runs.
      schema:
        type: integer
        minimum: 0
    RetryAfter:
      description: >-
        Seconds to wait before retrying.
        Sent with the edge's `rate_limited` throttle refusal. Not sent with
        `concurrency_limited`, which clears when one of the account's own jobs
        reaches a terminal state — a moment the API cannot put a number on.
      schema:
        type: integer
        minimum: 0
    # -------------------------------------------------------------------
    # Transcript provenance headers (ADR-0009). A `format=text|srt|vtt|md`
    # response body is the raw artifact, which has nowhere to carry the
    # provenance the JSON envelope carries in fields — so it travels here.
    # These are present on transcript-bearing responses only (raw artifacts
    # and, for symmetry, the JSON delivery of the same artifact); they are
    # absent from status-only, quote, and error responses. OpenAPI declares
    # response headers per response object rather than per media type, which
    # is why they are declared once on the whole `200` and described as
    # conditional here rather than being split per content type.
    # -------------------------------------------------------------------
    XTranscriptTimingPrecision:
      description: >-
        The delivered transcript's `timing_precision` (`word | segment |
        none`). every transcript exposes it, so it travels with every delivery format — a raw SRT body reports the same precision the
        canonical JSON would. Absent on responses that carry no transcript.
      schema:
        $ref: '#/components/schemas/TimingPrecision'
    XTranscriptEpisodeId:
      description: >-
        The canonical `episode_id` of the delivered transcript, so a raw
        artifact is not provenance-free. Absent on responses that carry no
        transcript.
      schema:
        $ref: '#/components/schemas/EpisodeId'
    XTranscriptSource:
      description: >-
        The delivered transcript's `source` — the pinned ASR engine, or
        `publisher` for passthrough. Absent on responses that carry no
        transcript.
      schema:
        $ref: '#/components/schemas/TranscriptSource'
    XCreditsCharged:
      description: >-
        Credits charged for this read, mirroring the `credits_charged` field
        of the JSON envelope so a raw-artifact delivery does not silently
        drop the billing figure. Absent on responses that carry no charge.
      schema:
        $ref: '#/components/schemas/CreditAmount'
  responses:
    BadRequestApiKey:
      description: >-
        Invalid request shape or an unrecognized pointer. Codes: `invalid_request`,
        `invalid_url`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedApiKey:
      description: >-
        Code `unauthenticated` — the API key is missing, malformed, revoked,
        or does not exist. Every operation in this document is
        authenticated, so this is the most common error path a client will
        hit; it is declared on all of them rather than left implicit. The
        response never distinguishes "no such key" from "revoked key".
        Unlike every other API-key response it carries no
        `X-RateLimit-Limit`: that is a per-account figure, and an
        unauthenticated request has no resolved account to report one for.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    # ---------------------------------------------------------------------
    # 409 conflict responses, one per operation rather than one shared
    # component (re-review minor): `POST /v1/transcripts` can only ever
    # return the two conflicts its `Idempotency-Key` header can produce
    # (`idempotency_conflict`, `request_in_progress`) — nothing else in the
    # request can conflict, and `GET /v1/transcripts/{job_id}` can only
    # return `job_not_completed` (it takes no `Idempotency-Key` and cannot be
    # cancelled). A single shared `ConflictApiKey` previously advertised all
    # three codes on every one of these operations, so e.g. `POST
    # /v1/transcripts` and the `DELETE` documented `job_not_completed`, which
    # neither can emit.
    #
    # The account-state conflicts of 0.6.0 (`account_suspended`,
    # `account_closed`, `account_not_found`) cut across that split rather
    # than fitting inside it: they belong to every operation that *spends*,
    # whatever else that operation can conflict on. So they are listed on
    # each spending operation's own component — the two below, plus
    # `ConflictApiKeyAccountState` for the episode read and
    # `ConflictApiKeyUploadAccountState` for an upload announcement, whose
    # only conflict they are — and on none of the operations that merely read. The
    # component names still say what each one's *first* conflict was;
    # renaming them would churn every `$ref` and the generated types for a
    # label.
    # ---------------------------------------------------------------------
    ConflictApiKeyIdempotency:
      description: >-
        The `Idempotency-Key`'s two conflicts, and the account's three.
        Codes: `idempotency_conflict` (the same key was reused with a
        different request body; not retryable as sent) and
        `request_in_progress` (the original request under this key is still
        running and has no answer to repeat yet; retryable — the same
        request under the same key, in a few seconds. Never a new key, which
        would start a second job for the same episode and charge both);
        plus `account_suspended`, `account_closed`, and `account_not_found`,
        which refuse this submission because the account behind the key may
        not spend (see `ErrorCode`). None of the account three is retryable:
        the same request meets the same account.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictApiKeyConfirm:
      description: >-
        The quote can no longer be confirmed as it stands, or the key was
        reused. Codes: `idempotency_conflict` (the same `Idempotency-Key`
        with a different body), `quote_expired` (past the quote's
        `expires_at`; take a new quote), `quote_mismatch` (an enclosure was
        republished since the quote; the message names the episode — take a
        new quote), `expected_total_mismatch` (the `expected_total_credits`
        sent disagrees with the quote's `total_ceiling_credits`; re-read the
        quote and restate its total, or take a new one), and
        `quote_unverified` (the fence could not re-probe every entry inside
        its budget; retryable — nothing was reserved, so send the same
        confirm again, or take a new quote if it keeps happening). None of
        the others is retryable as sent. The confirm spends, so it also
        answers the account-state three — `account_suspended`,
        `account_closed`, `account_not_found` — which refuse before any
        member is reserved and are about the account rather than the quote:
        a new quote does not help, and the quote itself is untouched.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictApiKeyAccountState:
      description: >-
        The account behind the key may not spend, so the charge this
        operation would make was refused and nothing was written. Codes:
        `account_suspended` (a billing or abuse hold — settle it or contact
        support), `account_closed` (the account is being deleted, or is
        deleted), `account_not_found` (no account row behind this
        credential; sign in to the dashboard, which creates it). None is
        retryable: the same request meets the same account.


        This operation's only `409`, and it appears here because the read
        *charges* on a cache hit. A delivery this account has already
        paid for is not refused — `GET /v1/reads/{read_id}` and the job poll
        take no money and answer a suspended account exactly as they answer
        an active one.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictApiKeyUploadAccountState:
      description: >-
        The account behind the key may not hold an upload allowance, so the
        announcement was refused and no row was written and no PUT URL
        signed. Codes: `account_suspended` (a billing or abuse hold — settle
        it or contact support), `account_closed` (the account is being
        deleted, or is deleted), `account_not_found` (no account row behind
        this credential; sign in to the dashboard, which creates it). None is
        retryable: the same request meets the same account.


        This operation's only `409`. An announcement spends no credits, but
        it holds storage against the account and hands back a URL that puts
        bytes in our bucket, so it is refused on the same three states a
        spending operation is.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictApiKeyJobNotCompleted:
      description: >-
        Code `job_not_completed` — a non-`json` `?format=` was requested
        (`PollFormatQueryParam`) on a job that has not reached `completed`;
        keep polling with no `format` or with `format=json`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableApiKey:
      description: >-
        The request was well-formed but cannot be fulfilled. Codes:
        `source_not_supported`, `feed_dead`, `episode_not_found`,
        `show_not_found`, `unsafe_source`, `unsupported_codec`,
        `unsupported_language`, `duration_exceeded`, `size_exceeded`. These
        carry three different `error.type` values, not two:
        `invalid_request` for `source_not_supported`/`unsafe_source` (fix
        your integration), `unprocessable_input` for
        `unsupported_codec`/`unsupported_language`/`duration_exceeded`/
        `size_exceeded` (this episode is outside published launch support),
        and `not_found` for `feed_dead`/`episode_not_found`/`show_not_found`
        (resolution failed with a typed catalog reason — the same three
        codes `NotFoundApiKey` carries at 404 for operations where the same
        failure is a lookup miss instead of an unprocessable request). A
        client branching on `type` must handle all three, not assume every
        code documented here is one of two things.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundApiKey:
      description: >-
        Codes: `feed_dead`, `episode_not_found`, `show_not_found`, or
        `job_not_found` (the job does not exist or belongs to another
        account — cross-account access is indistinguishable from
        nonexistence).
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    QuoteNotFoundApiKey:
      description: >-
        Code `quote_not_found` — no such quote for this account. Deliberately
        one answer for "never existed" and "belongs to another account": the
        quote is keyed under the account that took it, so the read misses
        either way, and a distinguishable refusal would turn a quote id into
        an oracle for whether another tenant holds one.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GroupNotFoundApiKey:
      description: >-
        Code `group_not_found` — no such job group for this account, for the
        same reason and with the same indistinguishability as
        `quote_not_found`. No member identifier is disclosed.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PaymentRequiredApiKey:
      description: Code `payment_required` — available account credits cannot cover the quote ceiling.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequestsApiKey:
      description: >-
        Codes `rate_limited`, `concurrency_limited`, or
        `upload_quota_exceeded`, from three different limits and three
        different places. `rate_limited` is the per-account
        request rate, refused at the edge before the operation
        runs: it carries `Retry-After` and no `X-RateLimit-Limit`, because
        nothing that knows the caller's tier has run yet.
        `concurrency_limited` is the cap on jobs open at once, refused by the
        operation itself: it carries `X-RateLimit-Limit` like every other
        answered response, and no `Retry-After`, because it clears when one of
        the account's own jobs finishes rather than after a fixed wait.
        `upload_quota_exceeded` is `POST /v1/uploads`' own admission refusal,
        returned before a PUT URL is issued when the account already holds
        its allowance (10 GiB across 100 unexpired uploads): like
        `concurrency_limited` it carries `X-RateLimit-Limit` and no
        `Retry-After`, because it clears when an upload's `retained_until`
        passes rather than after a fixed wait; its `message` names the limits
        hit and the earliest time enough capacity returns.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            uploadQuotaExceeded:
              summary: Upload allowance exhausted; names the earliest capacity return time
              value:
                error:
                  type: rate_limited
                  code: upload_quota_exceeded
                  message: >-
                    This account already holds 100 unexpired uploads
                    totalling 10 GiB, the account's allowance; enough
                    capacity returns at 2026-09-24T10:00:00Z, when the
                    oldest upload's reservation releases.
                  doc_url: https://docs.audivo.dev/errors#upload_quota_exceeded
                  request_id: req_3c8f1a9d2b4e
                  retryable: true
    ContentBlockedApiKey:
      description: Code `content_blocked` — a publisher or legal block is active.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ServiceUnavailableApiKey:
      description: >-
        Code `engine_unavailable` — the pinned provider route is unavailable;
        no silent provider/model switch occurs.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    DiscoveryUnavailableApiKey:
      description: >-
        Code `discovery_unavailable` — the show directory (Podcast Index)
        could not be reached, refused the request, or answered something
        this API cannot read as a show list. Retryable; a directory outage
        is never answered with an empty list, because an empty list is a
        valid answer to "shows in this category" and a caller would believe
        it.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NothingToQuoteApiKey:
      description: >-
        Code `nothing_to_quote` — the request was well-formed and every show
        or episode in it was excluded from the selection. The message counts
        the reasons (`music_led ×10`, `feed_unavailable ×2`, …) using the
        same vocabulary as `QuoteResponse.excluded`, so a caller can act on
        it: opt in to music-led shows, pick a different chart, or retry a
        feed that was down. Nothing is recorded for a quote that priced
        nothing.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalErrorApiKey:
      description: >-
        Code `internal_error` — a failure on our side that no other code
        describes. The message is fixed text and says nothing about the
        cause; `request_id` is what identifies it in our logs. Retryable.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnauthorizedDashboard:
      description: >-
        Code `unauthenticated` — the Cognito JWT is missing, malformed,
        expired, or was rejected. An API key presented to one of the
        operations that declare this response lands here too: they take a
        session and nothing else, and that
        is an authentication failure, not an authorization one. That includes
        `GET /v1/usage` and `GET /v1/limits`, which are served by the
        control-plane API alone.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequestDashboard:
      description: 'Code: `invalid_request`.'
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFoundDashboard:
      description: >-
        The referenced resource does not exist or does not belong to this
        account. Codes: `api_key_not_found` (`DELETE /v1/api-keys/{key_id}`),
        `credit_lot_not_found` (`POST /v1/billing/refund`),
        `oauth_request_not_found` (the two `/v1/oauth/requests/{request_id}`
        operations: decided already, or past its ten minutes), or
        `connected_app_not_found` (`DELETE /v1/connected-apps/{grant_id}`) —
        each operation emits only the one code for the resource it looks up.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictApiKeyCreate:
      description: >-
        The account cannot be issued a key right now. Codes:
        `api_key_limit_reached` (this account already holds the maximum
        number of live keys — revoke one you no longer use), or one of the
        account-state three, `account_suspended` / `account_closed` /
        `account_not_found`. `POST
        /v1/api-keys` is the first dashboard operation that writes, which is
        why it is the first to declare them. Revocation deliberately does
        not: switching off a credential stays available on an account that
        has been suspended, since a hold is when it matters most.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictAccountStateDashboard:
      description: >-
        The account's own state refuses this write. Codes:
        `account_suspended`, `account_closed`, or `account_not_found`. The same three
        `ConflictApiKeyCreate` declares, without the key-specific one — a
        separate component so no operation tells its callers about a refusal it
        cannot produce.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictBillingCheckout:
      description: >-
        No Checkout session was created. Codes: `tier_unchanged` (this account
        is already on the tier it asked to buy — manage the existing
        subscription through `POST /v1/billing/portal` instead of buying a
        second one), or one of the account-state three, `account_suspended` /
        `account_closed` / `account_not_found`.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ConflictBillingPortal:
      description: >-
        No portal session was created. Codes: `account_closed` or
        `account_not_found`.
        `account_suspended` is deliberately *not* here: the portal is the page
        that settles a hold, so a suspended account opens it like any other.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableDashboard:
      description: >-
        The request was well-formed but cannot be fulfilled. Code
        `credits_not_refundable` (`POST /v1/billing/refund`) — the named
        credit lots are consumed, promotional, expired, or otherwise
        ineligible for cash refund.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalErrorDashboard:
      description: >-
        Code `internal_error` — a call on our side failed and nothing was
        changed. On `POST /v1/session` this is what an unreachable identity
        service or an unreadable configuration answers with, deliberately
        rather than `401`: the session is not the problem, and telling a
        signed-in customer their token is bad during an outage of ours sends
        them into a sign-in loop. Retryable; `request_id` is what identifies
        it in our logs.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequestsDashboard:
      description: Code `rate_limited`, e.g. plan-change rate limiting.
      headers:
        X-Request-Id: { $ref: '#/components/headers/XRequestId' }
        Retry-After: { $ref: '#/components/headers/RetryAfter' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    # ---------------------------------------------------------------------
    # Identifiers. `ShowId`/`EpisodeId` patterns match the exact derivation
    # in packages/domain/src/ids.ts (ADR-0005): `sh_`/`ep_` plus 16
    # lowercase base32 characters (10 hashed bytes). `JobId`/`KeyId`/the
    # credit-lot and request IDs are first-party *opaque* tokens with no
    # derivation: their prefixes, alphabets, and lengths are decided in
    # ADR-0012, which is also where the deliberately looser bounds on the
    # Stripe identifiers this API echoes verbatim (`re_`, `in_`, `price_`)
    # are explained. Callers must not parse any of them.
    # ---------------------------------------------------------------------
    ShowId:
      type: string
      pattern: '^sh_[a-z2-7]{16}$'
      description: Canonical show identifier.
    EpisodeId:
      type: string
      pattern: '^ep_[a-z2-7]{16}$'
      description: Canonical episode identifier.
    JobId:
      type: string
      pattern: '^job_[A-Za-z0-9]{16,32}$'
      maxLength: 40
      description: Opaque, server-generated job identifier.
    KeyId:
      type: string
      pattern: '^key_[A-Za-z0-9]{16,32}$'
      maxLength: 40
      description: Opaque, server-generated API key identifier.
    Cursor:
      type: string
      pattern: '^[A-Za-z0-9_-]{1,512}$'
      description: An opaque pagination cursor. Callers must treat it as opaque.
    NullableCursor:
      description: An opaque pagination cursor, or `null` when there is no next page.
      anyOf:
        - $ref: '#/components/schemas/Cursor'
        - enum: [null]
    PodcastUrl:
      type: string
      format: uri
      minLength: 1
      maxLength: 2048
      description: An Apple Podcasts episode URL.
    FeedUrl:
      type: string
      format: uri
      minLength: 1
      maxLength: 2048
      description: An RSS/Atom feed URL.
    EpisodeGuid:
      type: string
      minLength: 1
      maxLength: 512
      description: >-
        An episode GUID as published in the feed's `<guid>` element. Used
        verbatim — GUIDs are case- and whitespace-significant.
    Language:
      type: string
      pattern: '^[A-Za-z]{2,3}(-[A-Za-z0-9]{1,8})*$'
      maxLength: 35
      description: A BCP-47 language tag (general syntax check, not full IANA subtag validation).
    NullableLanguage:
      description: >-
        A BCP-47 language tag, or `null`/omitted to auto-detect. Automatic
        detection never selects the ASR engine: it always routes to the
        configured default engine, and detected language is recorded only
        as a reporting field. Reaching a language outside the default
        engine's coverage requires passing this field explicitly.
      anyOf:
        - $ref: '#/components/schemas/Language'
        - enum: [null]
    NullableDateTime:
      description: An ISO 8601 timestamp, or `null`.
      anyOf:
        - type: string
          format: date-time
        - enum: [null]
    NullableUri:
      description: A URL, or `null`.
      anyOf:
        - type: string
          format: uri
          maxLength: 2048
        - enum: [null]
    RequestId:
      type: string
      pattern: '^req_[A-Za-z0-9-]+$'
      maxLength: 100
    # ---------------------------------------------------------------------
    # Error model (docs/engineering/api-design.md §3, ADR-0010). One `Error` component is used
    # by every error response. `code` is the specific documented reason;
    # `type` is a coarse, stable category a client can branch on without
    # enumerating every code.
    #
    # The `code -> type` mapping is enforced *structurally* on `ErrorDetail`
    # below, not merely described in prose: this document generates the
    # conformance suite, and a prose-only mapping means a handler emitting
    # `{type: "not_found", code: "payment_required"}` would validate and the
    # drift would go undetected. Each `if code in [...] then type: const...`
    # branch below makes exactly one `type` legal per `code`.
    #
    # `type` is deliberately not 1:1 with HTTP status — it groups codes by
    # what a client should *do*, which is the only thing a coarse field is
    # good for:
    # invalid_request the request or the pointer in it is wrong — fix
    # the integration; retrying as-is never helps.
    # unprocessable_input the request is well-formed and the pointer
    # resolves, but this episode is outside published
    # launch support — a different episode may work,
    # this one never will.
    # Splitting those two apart is the whole point of the field: they demand
    # opposite responses from the caller. docs/engineering/api-design.md §3's own worked
    # example pairs `type: "invalid_request"` with `code:
    # "source_not_supported"` (a 422 row in the same table), which is why
    # `source_not_supported` — and `unsafe_source`, likewise a property of
    # the pointer the caller supplied rather than of the episode's audio —
    # stay under `invalid_request` rather than moving to
    # `unprocessable_input`.
    # ---------------------------------------------------------------------
    ErrorType:
      type: string
      enum:
        - invalid_request
        - unprocessable_input
        - unauthenticated
        - conflict
        - not_found
        - content_blocked
        - payment_required
        - rate_limited
        - unavailable
      description: >-
        The family an error belongs to, for handling; `code` is the precise
        reason. `invalid_request`: something in the request is wrong — fix the
        integration. `unprocessable_input`: the request is well-formed but the
        episode or resource is outside published support. `unauthenticated`:
        missing, malformed, revoked or expired credential. `payment_required`:
        the account's credits cannot cover the ceiling. `conflict`: the
        resource's or the account's state refuses this request as sent — a lapsed
        quote, a reused idempotency key, a held account. `not_found`: the job,
        quote, group or key the request named does not exist for this account.
        `rate_limited`: over a plan limit; wait and retry. `unavailable`: a
        failure on our side or at a provider; retry, and quote `request_id` if it
        persists.
    ErrorCode:
      type: string
      enum:
        - invalid_request
        - invalid_url
        - unauthenticated
        - idempotency_conflict
        - job_not_completed
        - source_not_supported
        - feed_dead
        - episode_not_found
        - show_not_found
        - unsafe_source
        - unsupported_codec
        - unsupported_language
        - duration_exceeded
        - size_exceeded
        - content_blocked
        - payment_required
        - rate_limited
        - concurrency_limited
        - job_not_found
        - api_key_not_found
        - api_key_limit_reached
        - credit_lot_not_found
        - credits_not_refundable
        - engine_unavailable
        - processing_failed
        - discovery_unavailable
        - nothing_to_quote
        - internal_error
        - quote_not_found
        - group_not_found
        - quote_expired
        - quote_mismatch
        - quote_unverified
        - expected_total_mismatch
        - request_in_progress
        - account_suspended
        - account_closed
        - account_not_found
        - tier_unchanged
        - upload_quota_exceeded
        - upload_not_found
        - upload_not_received
        - upload_mismatch
        - max_credits_exceeded
        - oauth_request_not_found
        - connected_app_not_found
      description: >-
        Every code the API returns, and the HTTP status it comes with.
        `invalid_request`, `invalid_url` → 400. `unauthenticated` → 401.
        `payment_required` → 402. `job_not_found`, `quote_not_found`,
        `group_not_found`, `api_key_not_found`, `credit_lot_not_found`,
        `upload_not_found`, `oauth_request_not_found`,
        `connected_app_not_found` → 404.
        `idempotency_conflict`, `request_in_progress`, `job_not_completed`,
        `quote_expired`, `quote_mismatch`, `quote_unverified`,
        `expected_total_mismatch`, `account_suspended`, `account_closed`,
        `account_not_found`, `api_key_limit_reached`, `tier_unchanged`,
        `upload_not_received` → 409; `upload_not_received` is retryable once
        the file's PUT has landed.
        `source_not_supported`, `feed_dead`, `episode_not_found`,
        `show_not_found`, `unsafe_source`, `unsupported_codec`,
        `unsupported_language`, `duration_exceeded`, `size_exceeded`,
        `nothing_to_quote`, `credits_not_refundable`, `upload_mismatch`,
        `max_credits_exceeded` → 422. `content_blocked` →
        451. `rate_limited`, `concurrency_limited`, `upload_quota_exceeded` →
        429; `upload_quota_exceeded` is retryable, at the earliest capacity
        return time its message names. `internal_error`,
        `processing_failed` → 500. `discovery_unavailable`, `engine_unavailable`
        → 503. `processing_failed` also appears inside a failed job's `error`
        field rather than as a live status. Each code has a heading on the
        documentation site's errors page, which is what `doc_url` links to.
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [type, code, message, doc_url, request_id, retryable]
      properties:
        type:
          $ref: '#/components/schemas/ErrorType'
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          minLength: 1
          maxLength: 1000
        doc_url:
          type: string
          format: uri
          maxLength: 300
        request_id:
          $ref: '#/components/schemas/RequestId'
        retryable:
          type: boolean
      # The structural `code -> type` mapping (ADR-0010). Each branch pins
      # exactly one legal `type` for its code group, so a mismatched pair —
      # e.g. `{type: "not_found", code: "payment_required"}` — matches no
      # branch and fails validation instead of quietly passing, which is
      # what a prose-only mapping allowed. The branches are disjoint on
      # `code`, so at most one can ever match and `oneOf` is unambiguous.
      #
      # `oneOf` rather than a chain of `if//then`: it is exhaustive by
      # construction. A code added to `ErrorCode` but not to a branch here
      # matches zero branches and fails every error carrying it, so the
      # mapping cannot silently fall behind the enum — an `if/then` chain
      # would just skip it. (It also sidesteps a redocly bug: `properties`
      # inside an `if/then` makes its `no-invalid-media-type-examples`
      # validator report every property of this schema as "unevaluated",
      # a false failure ajv does not reproduce — the same trap documented
      # on `JobStatus` below.)
      #
      # `openapi/tests/document.test.ts` asserts both directions bite: every
      # documented pairing validates and a deliberately mismatched pairing
      # is rejected.
      oneOf:
        - required: [code, type]
          properties:
            code:
              enum: [invalid_request, invalid_url, source_not_supported, unsafe_source]
            type: { const: invalid_request }
        - required: [code, type]
          properties:
            code:
              enum:
                [
                  duration_exceeded,
                  size_exceeded,
                  unsupported_codec,
                  unsupported_language,
                  credits_not_refundable,
                  upload_mismatch,
                  max_credits_exceeded,
                ]
            type: { const: unprocessable_input }
        - required: [code, type]
          properties:
            code: { const: unauthenticated }
            type: { const: unauthenticated }
        - required: [code, type]
          properties:
            code:
              enum:
                [
                  idempotency_conflict,
                  job_not_completed,
                  quote_expired,
                  quote_mismatch,
                  quote_unverified,
                  expected_total_mismatch,
                  request_in_progress,
                  account_suspended,
                  account_closed,
                  account_not_found,
                  api_key_limit_reached,
                  tier_unchanged,
                  upload_not_received,
                ]
            type: { const: conflict }
        - required: [code, type]
          properties:
            code:
              enum:
                [
                  feed_dead,
                  episode_not_found,
                  show_not_found,
                  job_not_found,
                  quote_not_found,
                  group_not_found,
                  api_key_not_found,
                  credit_lot_not_found,
                  upload_not_found,
                  oauth_request_not_found,
                  connected_app_not_found,
                ]
            type: { const: not_found }
        - required: [code, type]
          properties:
            code: { const: content_blocked }
            type: { const: content_blocked }
        - required: [code, type]
          properties:
            code: { const: payment_required }
            type: { const: payment_required }
        - required: [code, type]
          properties:
            code:
              enum: [rate_limited, concurrency_limited, upload_quota_exceeded]
            type: { const: rate_limited }
        - required: [code, type]
          properties:
            code:
              enum: [engine_unavailable, processing_failed, discovery_unavailable, internal_error]
            type: { const: unavailable }
        - required: [code, type]
          properties:
            code: { const: nothing_to_quote }
            type: { const: unprocessable_input }
    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
    # ---------------------------------------------------------------------
    # Canonical transcript (docs/engineering/technical-spec.md §3.2), matching
    # packages/domain/src/transcript.ts field-for-field.
    # ---------------------------------------------------------------------
    TranscriptSource:
      type: string
      enum: [qwen3-asr, whisper-large-v3-turbo, whisper-large-v3, publisher]
      description: The ASR engine that produced this transcript, or `publisher` for passthrough.
    TimingPrecision:
      type: string
      enum: [word, segment, none]
      description: >-
        How precisely segments/words are timed. ASR output targets `word`.
        Publisher-sourced transcripts report the precision the source
        actually provides and never claim word timing they do not have:
        plain text is `none`, segment-timed sources are `segment`, and only
        genuine word-timed sources are `word`.
    TranscriptWarning:
      type: object
      additionalProperties: false
      required: [segment, type, detail]
      description: >-
        A quality warning from the pipeline's own checks, attached to the
        segment it concerns. Presented as a heuristic, not an accuracy guarantee;
        the transcript is delivered and charged as usual. `type` is an open
        string rather than a closed enum; the documentation's output-formats page
        lists the values in use.
      properties:
        segment:
          type: integer
          minimum: 0
          maximum: 1000000
        type:
          type: string
          minLength: 1
          maxLength: 60
        detail:
          type: string
          minLength: 1
          maxLength: 500
    TranscriptWord:
      type: object
      additionalProperties: false
      required: [w, s, e]
      properties:
        w:
          type: string
          minLength: 1
          maxLength: 200
          description: The word text.
        s:
          type: number
          minimum: 0
          maximum: 129600
          description: Start time in seconds.
        e:
          type: number
          minimum: 0
          maximum: 129600
          description: End time in seconds.
    TranscriptSegment:
      type: object
      additionalProperties: false
      required: [id, start, end, speaker, text]
      properties:
        id:
          type: integer
          minimum: 0
          maximum: 1000000
        start:
          type: number
          minimum: 0
          maximum: 129600
          description: Start time in seconds.
        end:
          type: number
          minimum: 0
          maximum: 129600
          description: End time in seconds.
        speaker:
          enum: [null]
          description: >-
            Always `null` in the MVP — diarization is post-MVP. A future diarized-speaker field is a
            deliberate, reviewed type change, not a silent widening.
        text:
          type: string
          maxLength: 20000
        words:
          type: array
          maxItems: 20000
          items:
            $ref: '#/components/schemas/TranscriptWord'
          description: Present when `timing_precision` is `word`; absent otherwise.
    CanonicalTranscript:
      type: object
      additionalProperties: false
      required:
        - episode_id
        - show_id
        - language
        - duration_sec
        - source
        - source_revision
        - model_version
        - pipeline_version
        - timing_precision
        - diarized
        - warnings
        - segments
        - created_at
      properties:
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        show_id:
          $ref: '#/components/schemas/ShowId'
        language:
          $ref: '#/components/schemas/Language'
          description: Resolved BCP-47 language code.
        duration_sec:
          type: number
          minimum: 0
          maximum: 129600
        source:
          $ref: '#/components/schemas/TranscriptSource'
        source_revision:
          type: string
          minLength: 1
          maxLength: 150
          description: 'e.g. `sha256:...` — the asset revision this transcript was produced from.'
        model_version:
          type: string
          minLength: 1
          maxLength: 100
          description: Provider-pinned model version, or `publisher` for passthrough.
        pipeline_version:
          type: string
          minLength: 1
          maxLength: 60
        timing_precision:
          $ref: '#/components/schemas/TimingPrecision'
        diarized:
          const: false
          description: >-
            Always `false` in the MVP; diarization is post-MVP.
        warnings:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/TranscriptWarning'
        segments:
          type: array
          maxItems: 200000
          items:
            $ref: '#/components/schemas/TranscriptSegment'
        created_at:
          type: string
          format: date-time
    TranscriptFormat:
      type: string
      enum: [json, text, srt, vtt, md]
      description: >-
        Delivery-only: never affects the cache key or the produced
        transcript content. Every
        format is derived at read time from the one canonical transcript. Response media type per format:
        `json` → `application/json`, `text` → `text/plain`, `srt` →
        `application/x-subrip`, `vtt` → `text/vtt`, `md` → `text/markdown`.
        The one exception is an oversized payload, which is
        `application/json` in every format (see `TranscriptUrlRef`).
    # ---------------------------------------------------------------------
    # Delivery envelopes (ADR-0009).
    #
    # A JSON envelope exists only for `format: json`. `text|srt|vtt|md` are
    # delivered as raw bodies under their own media types
    # (`RawTranscriptArtifact`), so no envelope here carries derived text in
    # a string field — a `content:` field embedding an SRT document inside
    # JSON would be a third representation of the same bytes and would leave
    # `docs/engineering/api-design.md` §2's "JSON by default" vacuous.
    #
    # `TranscriptArtifact` and `TranscriptRead` repeat the same flat shape
    # (rather than composing via `allOf`) because JSON Schema's
    # `additionalProperties: false` does not compose safely across `allOf`
    # siblings: each branch is evaluated against the *full* merged instance,
    # so a sibling's extra properties would be rejected by this schema's own
    # closed property list. Keeping each envelope self-contained avoids that
    # trap; the shared leaf schemas (CanonicalTranscript, TranscriptFormat)
    # are still fully reused via $ref.
    # ---------------------------------------------------------------------
    RawTranscriptArtifact:
      type: string
      maxLength: 5000000
      description: >-
        A derived transcript artifact delivered as a raw body under its own
        media type: `text/plain` (`format=text`), `application/x-subrip`
        (`srt`), `text/vtt` (`vtt`), or `text/markdown` (`md`). Provenance
        travels in the `X-Transcript-Episode-Id`, `X-Transcript-Source`, and
        `X-Transcript-Timing-Precision` response headers, because a raw body has no field to carry it. Bodies above the ~5 MB
        inline limit are not sent here at all: that response switches to
        `application/json` carrying a `TranscriptUrlRef`.
    TranscriptUrlRef:
      type: object
      additionalProperties: false
      required: [transcript_url, expires_at]
      description: >-
        The oversized-payload response — the single content-type switch in
        this API. A transcript above the ~5 MB inline limit is
        never sent inline in any format; instead the response is
        `200 application/json` with a presigned URL (24 h) and its expiry,
        even when `format` asked for `text`, `srt`, `vtt`, or `md`. For `format=json` the media type does not
        change, and the same two fields appear inside the JSON envelope
        (`TranscriptRead.transcript_url` / `TranscriptArtifact.transcript_url`)
        in place of the inline transcript — the behavior is identical in
        every format; only the raw formats also change media type.
      properties:
        transcript_url:
          type: string
          format: uri
          maxLength: 2048
        expires_at:
          type: string
          format: date-time
    TranscriptArtifact:
      type: object
      additionalProperties: false
      required: [format]
      description: >-
        The JSON delivery of a completed job's transcript, embedded in
        `JobStatus` when `status` is `completed` and JSON delivery was
        requested. `format` is always `json` here: the other formats are
        delivered as raw bodies (`RawTranscriptArtifact`), never wrapped in
        this envelope. Payloads above the ~5 MB inline limit carry
        `transcript_url` (presigned, 24 h) plus `expires_at` instead of an
        inline `transcript`.
      properties:
        format:
          const: json
        transcript:
          $ref: '#/components/schemas/CanonicalTranscript'
        transcript_url:
          type: string
          format: uri
          maxLength: 2048
        expires_at:
          type: string
          format: date-time
      oneOf:
        - required: [transcript]
        - required: [transcript_url, expires_at]
    TranscriptRead:
      type: object
      additionalProperties: false
      required: [format, is_cached, read_id, credits_charged, show_title, episode_title]
      description: >-
        A synchronous JSON transcript read: a cache hit or publisher
        passthrough (`POST /v1/transcripts`), a direct cached fetch
        (`GET /v1/episodes/{episode_id}/transcript`), or the re-delivery of
        a read that was already paid for
        (`GET /v1/reads/{read_id}`). `credits_charged` is what *this*
        request charged, which is why it is `0` on the last of the three and
        the cached-read price for this account on the other two. `format` is
        always `json`
        here — a `text|srt|vtt|md` read of the same transcript is delivered
        as a raw body with `X-Credits-Charged` carrying this envelope's
        `credits_charged`. See the comment above for why this
        shape is self-contained rather than composed via `allOf`.
      properties:
        format:
          const: json
        is_cached:
          type: boolean
        read_id:
          $ref: '#/components/schemas/JobId'
          description: >-
            The receipt this read was charged under (0.15.0).
            `GET /v1/reads/{read_id}` delivers the same transcript again, in
            any format, and charges nothing further.
        credits_charged:
          $ref: '#/components/schemas/CreditAmount'
        show_title:
          $ref: '#/components/schemas/JobShowTitle'
        episode_title:
          $ref: '#/components/schemas/JobEpisodeTitle'
        transcript:
          $ref: '#/components/schemas/CanonicalTranscript'
        transcript_url:
          type: string
          format: uri
          maxLength: 2048
        expires_at:
          type: string
          format: date-time
      oneOf:
        - required: [transcript]
        - required: [transcript_url, expires_at]
    CreditAmount:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: >-
        A non-negative JavaScript-safe integer credit amount. The upper bound
        matches `Number.MAX_SAFE_INTEGER`, which is enforced by the domain
        ledger so arithmetic and JSON round-trips cannot silently lose cents
        worth of credit precision.
    QuoteBasis:
      type: string
      enum: [feed_metadata, probed, declared]
      description: >-
        `feed_metadata` when the estimate is derived from feed-published
        duration; `probed` when a bounded enclosure probe measured it.
        `declared` when the caller stated it for an upload (ADR-0031).
    EstimatedProcessingSeconds:
      type: integer
      minimum: 0
      maximum: 72000
      description: >-
        Estimated **wall-clock** seconds until the job reaches a terminal
        state — intended for choosing a poll interval. This is
        *not* audio duration: audio duration has its own field
        (`duration_sec` on the transcript, `duration_sec` on
        `EpisodeSummary`), and conflating the two silently misprices
        everything a caller derives from it. The committed examples only make
        sense under this reading: `estimated_seconds: 420` alongside
        `estimated_credits: 268` cannot be audio seconds, because 7 audio
        minutes bills 7 credits at `CREDITS_PER_AUDIO_MINUTE`, while 268 credits is about
        4.5 hours of audio.


        The bound is derived from that meaning rather than copied from the
        audio cap: twice the published 10-hour `max_audio_duration_seconds`
        ceiling, an end-to-end envelope that still holds at a pathological
        1× realtime factor. The real hard per-job timeout is duration-scaled
        and much shorter.
    TranscriptQuote:
      type: object
      additionalProperties: false
      required:
        - episode_id
        - dry_run
        - is_cached
        - estimated_credits
        - quote_ceiling_credits
        - quote_basis
        - estimated_seconds
      description: >-
        A dry-run quote: the `dry_run: true` response of
        `POST /v1/transcripts`. Explicitly carries no `job_id` and no
        reservation fields — a dry run creates neither.
        The accepted ceiling from a quote is honored exactly if a job is
        later submitted: probing may reduce settled usage, but the system
        never raises the ceiling or settles above it without a new customer
        action.


        `GET /v1/episodes/{episode_id}/transcript` returns the same figures
        for its "nothing cached yet" case, but as `EpisodeQuoteHint` — that
        request was not a dry run, so it must not claim `dry_run: true`.
      properties:
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        dry_run:
          const: true
        is_cached:
          type: boolean
        estimated_credits:
          $ref: '#/components/schemas/CreditAmount'
        quote_ceiling_credits:
          $ref: '#/components/schemas/CreditAmount'
          description: 'estimate + 25%, rounded up.'
        quote_basis:
          $ref: '#/components/schemas/QuoteBasis'
        estimated_seconds:
          $ref: '#/components/schemas/EstimatedProcessingSeconds'
    EpisodeQuoteHint:
      type: object
      additionalProperties: false
      required:
        - episode_id
        - is_cached
        - estimated_credits
        - quote_ceiling_credits
        - quote_basis
        - estimated_seconds
      description: >-
        The "no compatible cache object exists yet" response of
        `GET /v1/episodes/{episode_id}/transcript`: the same quote figures as
        `TranscriptQuote`, minus `dry_run`. It is a separate schema rather
        than a reuse of `TranscriptQuote` because that schema pins
        `dry_run: const true`, and this request was not a dry run — a
        response asserting otherwise would be a lie the generated SDK and
        conformance suite would both propagate. Like a dry run it creates no
        job and no reservation; call `POST /v1/transcripts` for that. The two
        shapes stay disjoint (`additionalProperties: false` on both, one
        requiring `dry_run` and the other forbidding it), so a `oneOf`
        between them is unambiguous.
      properties:
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        is_cached:
          type: boolean
        estimated_credits:
          $ref: '#/components/schemas/CreditAmount'
        quote_ceiling_credits:
          $ref: '#/components/schemas/CreditAmount'
          description: 'estimate + 25%, rounded up.'
        quote_basis:
          $ref: '#/components/schemas/QuoteBasis'
        estimated_seconds:
          $ref: '#/components/schemas/EstimatedProcessingSeconds'
    TranscriptJobAccepted:
      type: object
      additionalProperties: false
      required:
        - job_id
        - group_id
        - status
        - episode_id
        - estimated_credits
        - quote_ceiling_credits
        - quote_basis
        - reserved_credits
        - is_cached
        - estimated_seconds
      description: >-
        Returned on `202` when fresh work is accepted.
        The job is the one member of the group `group_id` names.
      properties:
        job_id:
          $ref: '#/components/schemas/JobId'
        group_id:
          $ref: '#/components/schemas/GroupId'
        status:
          $ref: '#/components/schemas/JobState'
          description: >-
            `validating` or `queued` on a first acceptance.
            A repeat under the same `Idempotency-Key` returns the same job
            in whatever state it has reached since, so a client that retried
            is never told a job is queued when it is already transcribing.
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        estimated_credits:
          $ref: '#/components/schemas/CreditAmount'
        quote_ceiling_credits:
          $ref: '#/components/schemas/CreditAmount'
        quote_basis:
          $ref: '#/components/schemas/QuoteBasis'
        reserved_credits:
          $ref: '#/components/schemas/CreditAmount'
          description: The quote ceiling, atomically reserved at accept time.
        is_cached:
          type: boolean
        estimated_seconds:
          $ref: '#/components/schemas/EstimatedProcessingSeconds'
    # ---------------------------------------------------------------------
    # POST /v1/transcripts request: exactly one of three input shapes.
    # Each branch sets `additionalProperties: false` and requires its own
    # discriminating field(s), so a request naming fields from more than one
    # branch matches zero branches and fails `oneOf` (docs/product/mvp-contract.md §4).
    # ---------------------------------------------------------------------
    TranscriptCreateByUrl:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          $ref: '#/components/schemas/PodcastUrl'
        language:
          $ref: '#/components/schemas/NullableLanguage'
        format:
          $ref: '#/components/schemas/TranscriptFormat'
        dry_run:
          type: boolean
          default: false
        max_credits:
          $ref: '#/components/schemas/CreditAmount'
          description: >-
            The most this call may take; refused `422 max_credits_exceeded`
            before anything is reserved when it could take more. Omit for no
            cap beyond the balance.
    TranscriptCreateByFeedGuid:
      type: object
      additionalProperties: false
      required: [feed_url, guid]
      properties:
        feed_url:
          $ref: '#/components/schemas/FeedUrl'
        guid:
          $ref: '#/components/schemas/EpisodeGuid'
        language:
          $ref: '#/components/schemas/NullableLanguage'
        format:
          $ref: '#/components/schemas/TranscriptFormat'
        dry_run:
          type: boolean
          default: false
        max_credits:
          $ref: '#/components/schemas/CreditAmount'
          description: >-
            The most this call may take; refused `422 max_credits_exceeded`
            before anything is reserved when it could take more. Omit for no
            cap beyond the balance.
    TranscriptCreateByEpisodeId:
      type: object
      additionalProperties: false
      required: [episode_id]
      description: >-
        An episode by its canonical id. One the catalog already holds needs
        nothing else, and its feed is not read again. One nobody has
        transcribed yet, as `GET /v1/shows/{show_id}/episodes` lists them,
        is in no catalog row: send the `feed_url` and `itunes_id` that
        listing took, and the feed is read for the item whose id matches
        (ADR-0038). Without them such an id is `404 episode_not_found`; with
        them, an id the feed does not hold under that Apple id is `422
        episode_not_found`. When the catalog holds the episode, its row wins
        over the feed sent.
      properties:
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        feed_url:
          $ref: '#/components/schemas/FeedUrl'
        itunes_id:
          description: >-
            The show's Apple id, as the listing took it, or `null` for a show
            that has none. Only with `feed_url`: it decides how the show's id,
            and so the episode's, derives (ADR-0005).
          anyOf:
            - type: integer
              minimum: 1
            - enum: [null]
        language:
          $ref: '#/components/schemas/NullableLanguage'
        format:
          $ref: '#/components/schemas/TranscriptFormat'
        dry_run:
          type: boolean
          default: false
        max_credits:
          $ref: '#/components/schemas/CreditAmount'
          description: >-
            The most this call may take; refused `422 max_credits_exceeded`
            before anything is reserved when it could take more. Omit for no
            cap beyond the balance.
    TranscriptCreateByUpload:
      type: object
      additionalProperties: false
      required: [upload_id]
      properties:
        upload_id:
          $ref: '#/components/schemas/UploadId'
        language:
          $ref: '#/components/schemas/NullableLanguage'
        format:
          $ref: '#/components/schemas/TranscriptFormat'
        dry_run:
          type: boolean
          default: false
        max_credits:
          $ref: '#/components/schemas/CreditAmount'
          description: >-
            The most this call may take; refused `422 max_credits_exceeded`
            before anything is reserved when it could take more. Omit for no
            cap beyond the balance.
    TranscriptCreateRequest:
      description: >-
        Exactly one of `url`, `feed_url`+`guid`, `episode_id` (with the
        `feed_url` and `itunes_id` it was listed under, when the catalog does
        not hold it yet), or `upload_id`. `format` is delivery-only and never affects the cache
        key or the produced transcript. Raw-audio URLs,
        engine selection, diarization, vocabulary, and callback URLs are
        rejected rather than ignored.
      oneOf:
        - $ref: '#/components/schemas/TranscriptCreateByUrl'
        - $ref: '#/components/schemas/TranscriptCreateByFeedGuid'
        - $ref: '#/components/schemas/TranscriptCreateByEpisodeId'
        - $ref: '#/components/schemas/TranscriptCreateByUpload'
    # ---------------------------------------------------------------------
    # Job state and status (docs/product/mvp-contract.md §5), matching
    # packages/domain/src/job-state.ts's JOB_STATES exactly.
    # ---------------------------------------------------------------------
    JobState:
      type: string
      enum: [validating, queued, downloading, transcribing, merging, completed, failed, cancelled]
      description: >-
        Legal transitions: validating → queued|failed|cancelled; queued →
        downloading|failed|cancelled; downloading → transcribing|failed;
        transcribing → merging|failed; merging → completed|failed. Terminal
        states (completed, failed, cancelled) have no further transitions.
        Cancellation is legal only from validating/queued; every
        non-terminal state may fail.
    JobProgress:
      type: object
      additionalProperties: false
      required: [chunks_done, chunks_total, percent, realtime_factor, eta_seconds]
      properties:
        chunks_done:
          type: integer
          minimum: 0
          maximum: 100000
        chunks_total:
          type: integer
          minimum: 0
          maximum: 100000
        percent:
          type: number
          minimum: 0
          maximum: 100
        realtime_factor:
          type: number
          minimum: 0
          maximum: 10000
        eta_seconds:
          description: >-
            Estimated wall-clock seconds remaining until this job reaches a
            terminal state, or `null` if not yet computable. Same quantity
            and same bound as `estimated_seconds`, measured later
            in the job's life — so it shares
            `EstimatedProcessingSeconds` rather than carrying its own copy of
            the audio-duration ceiling.
          anyOf:
            - $ref: '#/components/schemas/EstimatedProcessingSeconds'
            - enum: [null]
    JobShowTitle:
      description: >-
        The show's title as it was when this job or read was created
        (ADR-0036), or `null` when it was created without one: before
        0.14.0, or from a feed that names no show. For an upload it is
        `Uploads`. Copied once, never updated.
      anyOf:
        - type: string
          minLength: 1
          maxLength: 300
        - type: 'null'
    JobEpisodeTitle:
      description: >-
        The episode's title as it was when this job or read was created, or
        `null` when it was created without one. For an upload it is the
        title given when the file was announced. Where a feed gave no
        title, a catalog read (`GET /v1/episodes/{episode_id}/transcript`)
        answers the identifier the catalog stores in its place.
      anyOf:
        - type: string
          minLength: 1
          maxLength: 300
        - type: 'null'
    JobStatus:
      type: object
      additionalProperties: false
      required:
        [
          job_id,
          status,
          episode_id,
          show_title,
          episode_title,
          estimated_credits,
          reserved_credits,
          created_at,
        ]
      description: >-
        Failure/cancellation objects report `reservation_released: true` and
        never imply a cash refund occurred — a cash refund is a separate,
        explicit Stripe refund via `POST /v1/billing/refund`.
      properties:
        job_id:
          $ref: '#/components/schemas/JobId'
        status:
          $ref: '#/components/schemas/JobState'
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        show_title:
          $ref: '#/components/schemas/JobShowTitle'
        episode_title:
          $ref: '#/components/schemas/JobEpisodeTitle'
        progress:
          $ref: '#/components/schemas/JobProgress'
        estimated_credits:
          $ref: '#/components/schemas/CreditAmount'
        reserved_credits:
          $ref: '#/components/schemas/CreditAmount'
        settled_credits:
          $ref: '#/components/schemas/CreditAmount'
          description: Present on terminal `completed` jobs; measured usage capped at the reservation.
        released_credits:
          $ref: '#/components/schemas/CreditAmount'
          description: Present on terminal states; the unused portion of the reservation released back to the account.
        reservation_released:
          type: boolean
          description: Present on terminal `failed`/`cancelled` jobs. Never implies a cash refund.
        ledger_event_ids:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 80
          description: Immutable ledger event IDs, present on terminal states.
        error:
          $ref: '#/components/schemas/ErrorDetail'
          description: Present when `status` is `failed`; code `processing_failed` with retryability metadata.
        artifact:
          $ref: '#/components/schemas/TranscriptArtifact'
          description: >-
            The completed transcript, in JSON delivery. Present only when
            `status` is `completed` **and** the caller explicitly asked for
            it with `?format=json` on `GET /v1/transcripts/{job_id}` —
            `PollFormatQueryParam` has no default, so omitting `format`
            there is a real, distinct request that never carries `artifact`,
            whatever `status` is. It is deliberately *not* required by
            `completed`: a client polling a finished job would
            otherwise be forced to re-download the whole transcript on every
            call, with no status-only option.
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
      # `no-required-schema-properties-undefined` (redocly lint) flags the
      # `required` lists below because it does not trace `required` in a
      # nested `allOf`/`if`/`then` branch back to `properties` declared on
      # this schema's own top level, even though that is exactly how JSON
      # Schema 2020-12 evaluates it (verified directly with ajv: every
      # property named below is declared above and every named example
      # validates). Earlier attempts to silence it by repeating
      # `properties: { x: true }` stubs inside `then` triggered a *worse*,
      # incorrect failure in redocly's own example validator
      # (`no-invalid-media-type-examples`) that ajv does not reproduce, so
      # this stays as a documented, verified-safe warning rather than a
      # workaround that trades a false warning for a false error.
      #
      # Each conditional is two-directional: the `else` branch forbids the
      # state-specific fields outside their own state. Without it the schema
      # accepted an `error` on a `queued` job and an `artifact` on a
      # `transcribing` one — a generated client would have had to treat both
      # as possible everywhere.
      allOf:
        - if:
            required: [status]
            properties:
              status: { const: failed }
          then:
            required: [reservation_released, released_credits, error]
          else:
            not:
              required: [error]
        - if:
            required: [status]
            properties:
              status: { const: cancelled }
          then:
            required: [reservation_released, released_credits]
        - if:
            required: [status]
            properties:
              status: { enum: [failed, cancelled] }
          else:
            not:
              required: [reservation_released]
        - if:
            required: [status]
            properties:
              status: { const: completed }
          then:
            required: [settled_credits, released_credits]
          else:
            allOf:
              - not:
                  required: [settled_credits]
              - not:
                  required: [artifact]
        - if:
            required: [status]
            properties:
              status: { enum: [completed, failed, cancelled] }
          else:
            allOf:
              - not:
                  required: [released_credits]
              - not:
                  required: [ledger_event_ids]
    # ---------------------------------------------------------------------
    # Catalog (docs/engineering/technical-spec.md §4, §6.2).
    # ---------------------------------------------------------------------
    ShowSummary:
      type: object
      additionalProperties: false
      required:
        - show_id
        - title
        - feed_url
        - itunes_id
        - author
        - categories
        - artwork_url
        - music_led
        - music_led_basis
      description: >-
        One show as a discovery surface returns it (search or chart), before
        any selection rule applies. `show_id` is derived from the provider's
        iTunes id when it carries one and from the feed URL otherwise, so it is stable across the two surfaces and the quote.
        `music_led` is the music-led marking: a coarse, show-level judgement from
        the provider's category labels — `music_led_basis` says which — that
        cannot see a music bed inside a talk show and over-excludes spoken
        commentary *about* music; the caller can opt back in when quoting.
      properties:
        show_id:
          $ref: '#/components/schemas/ShowId'
        title:
          type: string
          minLength: 1
          maxLength: 300
        feed_url:
          $ref: '#/components/schemas/FeedUrl'
        itunes_id:
          description: The iTunes collection ID, or `null` if the provider knows none.
          anyOf:
            - type: integer
              minimum: 1
            - enum: [null]
        author:
          description: The show's author as the provider carries it, or `null`.
          anyOf:
            - type: string
              maxLength: 300
            - enum: [null]
        categories:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 100
          description: The provider's category names for the show, in provider order.
        artwork_url:
          $ref: '#/components/schemas/NullableUri'
        music_led:
          type: boolean
          description: Whether the show is music-led; see the schema description.
        music_led_basis:
          type: string
          minLength: 1
          maxLength: 300
          description: What `music_led` is based on, in words a caller can show.
    DiscoveryExclusion:
      type: object
      additionalProperties: false
      required: [title, reason, detail]
      description: >-
        A provider entry a caller cannot act on, named rather than dropped:
        without a usable feed URL there is no `show_id` to derive and nothing
        to select. Present so a list never shrinks silently.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        reason:
          type: string
          enum: [no_feed_url, invalid_feed_url]
        detail:
          type: string
          minLength: 1
          maxLength: 1000
    ShowSearchResponse:
      type: object
      additionalProperties: false
      required: [data, excluded, next_cursor]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ShowSummary'
        excluded:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DiscoveryExclusion'
        next_cursor:
          $ref: '#/components/schemas/NullableCursor'
          description: Always `null`; the provider does not page this call.
    TierClamp:
      type: object
      additionalProperties: false
      required: [requested, allowed, limit, clamped]
      description: >-
        One number after the caller's tier had its say.
        `requested` is what was asked for, `allowed` what the tier permitted,
        `limit` the ceiling that produced it — reported whether or not the
        ceiling bit, because "your 40-show chart became 10" is the sentence a
        caller can act on and "10 shows" alone is not.
      properties:
        requested:
          type: integer
          minimum: 1
        allowed:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        clamped:
          type: boolean
    ChartResponse:
      type: object
      additionalProperties: false
      required: [category, language, size, data, excluded]
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 100
        language:
          anyOf:
            - $ref: '#/components/schemas/Language'
            - enum: [null]
        size:
          $ref: '#/components/schemas/TierClamp'
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ShowSummary'
          description: The chart, in provider order, at most `size.allowed` long.
        excluded:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/DiscoveryExclusion'
    # ---------------------------------------------------------------------
    # POST /v1/quotes (core-and-surfaces plan R4, R16, R17; KTD2, KTD8).
    # The request is one of two disjoint shapes — a chart to fetch, or shows
    # the caller names — each with `additionalProperties: false` and its own
    # required discriminating field, so a body carrying both matches neither.
    # ---------------------------------------------------------------------
    QuoteId:
      type: string
      pattern: '^qte_[A-Za-z0-9]{16,32}$'
      maxLength: 40
      description: Opaque, server-generated quote identifier.
    UploadId:
      type: string
      pattern: '^upl_[A-Za-z0-9]{16,32}$'
      maxLength: 40
      description: Opaque, server-generated upload identifier.
    UploadContentType:
      type: string
      enum:
        - audio/mpeg
        - audio/mp3
        - audio/mp4
        - audio/m4a
        - audio/x-m4a
        - audio/aac
        - audio/x-aac
        - audio/ogg
        - audio/opus
        - audio/flac
        - audio/x-flac
        - audio/wav
        - audio/x-wav
        - audio/webm
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [sha256, bytes, content_type, declared_duration_seconds]
      properties:
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
          description: The file's SHA-256, lowercase hex. The PUT is signed against it.
        bytes:
          type: integer
          minimum: 1
          maximum: 5368709120
          description: The file's exact length; the PUT must carry the same `Content-Length`.
        content_type:
          $ref: '#/components/schemas/UploadContentType'
        declared_duration_seconds:
          type: number
          exclusiveMinimum: 0
          maximum: 36000
          description: >-
            What the quote is priced from. A job whose audio runs past the
            ceiling this reserves fails as `processing_failed`, with a
            message naming the declared-duration ceiling, and releases the
            reservation.
        title:
          type: string
          minLength: 1
          maxLength: 300
          description: How the entry is labelled; the private show is always "Uploads".
    UploadCreated:
      type: object
      additionalProperties: false
      required:
        - upload_id
        - put_url
        - put_headers
        - put_url_expires_at
        - retained_until
        - bytes
        - content_type
        - declared_duration_seconds
        - title
      properties:
        upload_id:
          $ref: '#/components/schemas/UploadId'
        put_url:
          type: string
          format: uri
          maxLength: 4096
          description: Presigned `PUT`; send the file body with `put_headers` and nothing else.
        put_headers:
          type: object
          additionalProperties:
            type: string
          description: Every header the PUT must carry, verbatim; they are part of the signature.
        put_url_expires_at:
          type: string
          format: date-time
        retained_until:
          type: string
          format: date-time
          description: Logical upload expiry and allowance-release time; physical cleanup is asynchronous.
        bytes:
          type: integer
          minimum: 1
        content_type:
          $ref: '#/components/schemas/UploadContentType'
        declared_duration_seconds:
          type: number
          exclusiveMinimum: 0
        title:
          anyOf:
            - type: string
              maxLength: 300
            - enum: [null]
    NamedShow:
      type: object
      additionalProperties: false
      required: [feed_url]
      description: >-
        A show the caller chooses by feed URL — usually copied from a
        `ShowSummary`. `itunes_id` travels with it because it changes how
        `show_id` derives; `title` is only the label the quote
        shows back, and defaults to the feed URL.


        `episode_ids` is how a caller reaches an episode that is not among the
        newest: name it, and this show contributes exactly the episodes named
        instead of its newest N. Without it the selection grammar is only
        "the newest N per show", so a back-catalogue episode would be
        unreachable at any tier: `episodes_per_show` sets how wide the newest-N
        window is, never where it sits.
      properties:
        feed_url:
          $ref: '#/components/schemas/FeedUrl'
        episode_ids:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/EpisodeId'
          description: >-
            The exact episodes this show should contribute, as
            `GET /v1/shows/{show_id}/episodes` returns their ids. Omit it to
            take the newest `episodes_per_show` instead. The two are
            alternatives and do not combine: `episodes_per_show` is the N in
            "the newest N", which a caller who named their episodes has said
            nothing about, so it is not applied to them. What still bounds a
            named selection is the plan's total for the whole selection; no
            tier carries a per-show depth cap. An id that matches
            nothing in the feed comes back as an `episode_not_in_feed`
            exclusion rather than shortening the list silently.
        itunes_id:
          anyOf:
            - type: integer
              minimum: 1
            - enum: [null]
        title:
          type: string
          minLength: 1
          maxLength: 300
    ChartSelection:
      type: object
      additionalProperties: false
      required: [category]
      description: The same chart `GET /v1/charts` returns, fetched and clamped inside the quote.
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 100
        size:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
          description: Clamped to the tier's chart cap, and the clamp is reported.
        language:
          $ref: '#/components/schemas/Language'
    QuoteFromShows:
      type: object
      additionalProperties: false
      required: [shows]
      properties:
        shows:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/NamedShow'
        episodes_per_show:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          description: >-
            The N in "the newest N episodes per show". Ignored for a
            show whose `episode_ids` name its episodes. Clamped to the plan's
            whole selection total when it exceeds it, and reported.
        include_music_led:
          type: boolean
          description: >-
            The music-led switch. Named shows are taken as chosen, so it changes
            nothing here; it is accepted so one client can send one body
            shape for both sources.
    QuoteFromChart:
      type: object
      additionalProperties: false
      required: [chart]
      properties:
        chart:
          $ref: '#/components/schemas/ChartSelection'
        episodes_per_show:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
          description: >-
            The N in "the newest N episodes per show". Ignored for a
            show whose `episode_ids` name its episodes. Clamped to the plan's
            whole selection total when it exceeds it, and reported.
        include_music_led:
          type: boolean
          default: false
          description: >-
            The music-led opt-in. A chart is uncurated, so music-led entries are
            excluded from the selection — each named in `excluded` — unless
            this is `true`.
    QuoteFromUploads:
      type: object
      additionalProperties: false
      required: [uploads]
      properties:
        uploads:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            additionalProperties: false
            required: [upload_id]
            properties:
              upload_id:
                $ref: '#/components/schemas/UploadId'
      description: >-
        Uploads the caller announced and sent. Each is verified with one
        object head — present, the declared length, the declared hash — and
        priced from its declared duration. One that fails the check comes
        back in `excluded` as `upload_not_received` or `upload_mismatch`; an
        unknown or expired id as `upload_not_found`.
    QuoteRequest:
      oneOf:
        - $ref: '#/components/schemas/QuoteFromShows'
        - $ref: '#/components/schemas/QuoteFromChart'
        - $ref: '#/components/schemas/QuoteFromUploads'
    QuoteEntry:
      type: object
      additionalProperties: false
      required:
        - episode_id
        - show_id
        - feed_url
        - guid
        - show_title
        - episode_title
        - published_at
        - is_cached
        - estimated_credits
        - quote_ceiling_credits
        - quote_basis
        - declared_duration_seconds
      description: >-
        One priced episode. An uncached entry carries the domain's estimate
        from the feed-declared duration and its ceiling; a cached one is priced at what a
        cached read costs the calling account with no ceiling above it — there is no measurement left to
        exceed.
      properties:
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        show_id:
          $ref: '#/components/schemas/ShowId'
        feed_url:
          $ref: '#/components/schemas/FeedUrl'
        guid:
          $ref: '#/components/schemas/EpisodeGuid'
        show_title:
          type: string
          minLength: 1
          maxLength: 300
        episode_title:
          anyOf:
            - type: string
              maxLength: 300
            - enum: [null]
        published_at:
          $ref: '#/components/schemas/NullableDateTime'
        is_cached:
          type: boolean
        estimated_credits:
          $ref: '#/components/schemas/CreditAmount'
        quote_ceiling_credits:
          $ref: '#/components/schemas/CreditAmount'
        quote_basis:
          $ref: '#/components/schemas/QuoteBasis'
        declared_duration_seconds:
          type: number
          minimum: 0
          description: The feed's `<itunes:duration>`, or the caller's declaration for an upload, in seconds — what the estimate is priced from.
        upload_id:
          $ref: '#/components/schemas/UploadId'
          description: Present when the entry is an upload; `feed_url` is then the account's private `audivo://uploads/…` show.
    QuoteExclusionReason:
      type: string
      enum:
        - feed_unavailable
        - feed_unparseable
        - budget_exceeded
        - music_led
        - no_feed_url
        - duplicate_show
        - chart_size_capped
        - total_selection_capped
        - no_episodes
        - no_guid
        - no_enclosure
        - episode_not_in_feed
        - episode_not_found
        - no_declared_duration
        - no_stable_asset_revision
        - upload_not_found
        - upload_not_received
        - upload_mismatch
      description: >-
        Every reason a show or an episode can be missing from a quote, in one
        closed vocabulary shared by the selection rule and the quote: the caller reads one list, not two. The
        `nothing_to_quote` error message counts these same words.
    QuoteExclusion:
      type: object
      additionalProperties: false
      required: [feed_url, guid, title, reason, detail]
      description: >-
        One thing the caller asked for that is not in `entries`. `guid` is
        `null` when a whole show was excluded; `feed_url` is `null` only when
        the provider carried none. `title` is what a surface shows a human —
        the show's name, or `show — episode` for one episode.
      properties:
        feed_url:
          anyOf:
            - $ref: '#/components/schemas/FeedUrl'
            - enum: [null]
        guid:
          anyOf:
            - $ref: '#/components/schemas/EpisodeGuid'
            - enum: [null]
        title:
          type: string
          minLength: 1
          maxLength: 600
        reason:
          $ref: '#/components/schemas/QuoteExclusionReason'
        detail:
          type: string
          minLength: 1
          maxLength: 1000
    SelectionClamp:
      type: object
      additionalProperties: false
      required: [dimension, requested, allowed, limit, clamped, detail]
      description: A tier ceiling that bit, in the terms the caller used.
      properties:
        dimension:
          type: string
          enum: [chart_size, episodes_per_show, total_selection]
        requested:
          type: integer
          minimum: 1
        allowed:
          type: integer
          minimum: 0
        limit:
          type: integer
          minimum: 1
        clamped:
          const: true
        detail:
          type: string
          minLength: 1
          maxLength: 1000
    QuoteResponse:
      type: object
      additionalProperties: false
      required:
        - quote_id
        - source
        - episodes_per_show
        - entries
        - excluded
        - clamps
        - cached_members
        - uncached_members
        - total_ceiling_credits
        - remaining_open_jobs
        - balance_credits
        - reserved_credits
        - expires_at
        - created_at
      description: >-
        The recorded quote. `total_ceiling_credits` is the sum of the
        entries' ceilings and `cached_members` the count of entries with
        `is_cached: true` — both derived by the store at write time, never
        taken from a caller. The quote is valid until `expires_at`; a
        confirm after that is refused.


        `balance_credits` and `reserved_credits` are the caller's account as
        it stood when the quote was priced, read off the same row
        `remaining_open_jobs` was counted from — so an agent can see what it
        holds at the moment it decides to spend without a second call.
        Like the headroom beside them they are **reported, never enforced**: a
        quote reserves nothing, so a balance below `total_ceiling_credits` is
        a fact to act on rather than a refusal, and affordability is decided
        by the confirm.
      properties:
        quote_id:
          $ref: '#/components/schemas/QuoteId'
        source:
          type: string
          enum: [shows, chart, uploads]
          description: Which request shape produced this quote.
        episodes_per_show:
          type: integer
          minimum: 1
          description: The N after the tier had its say.
        entries:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/QuoteEntry'
        excluded:
          type: array
          items:
            $ref: '#/components/schemas/QuoteExclusion'
        clamps:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/SelectionClamp'
        cached_members:
          type: integer
          minimum: 0
        uncached_members:
          type: integer
          minimum: 0
        total_ceiling_credits:
          $ref: '#/components/schemas/CreditAmount'
        remaining_open_jobs:
          type: integer
          minimum: 0
          description: >-
            How many more jobs the caller's tier lets them have open — reserved
            and not yet terminal — right now, so a
            selection can be sized before it is confirmed. Reported here,
            enforced at confirm.
        balance_credits:
          $ref: '#/components/schemas/CreditAmount'
        reserved_credits:
          $ref: '#/components/schemas/CreditAmount'
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
    # ---------------------------------------------------------------------
    # The job group (core-and-surfaces plan KTD3; R8, R9, R26, R27):
    # what one confirm created, and the one shape the confirm, the read,
    # and the cancel all answer with.
    # ---------------------------------------------------------------------
    GroupId:
      type: string
      pattern: '^grp_[A-Za-z0-9]{16,32}$'
      maxLength: 40
      description: Opaque, server-generated job group identifier.
    JobGroupStatus:
      type: string
      enum: [pending, complete, abandoned]
      description: >-
        `pending` while a confirm is still fanning out (or died doing so);
        `complete` once every member landed; `abandoned` once the sweeper
        returned a pending group's reservations past its deadline. A cancelled group is `complete` with `cancelled` members.
    ConfirmRequest:
      type: object
      additionalProperties: false
      description: >-
        The quote is in the path and the key is in the header, so the body
        carries at most the spending fence below. An empty object, or no
        body at all, is accepted; any other property is refused, so a
        further field can be added without an old client having silently
        sent it.
      properties:
        expected_total_credits:
          $ref: '#/components/schemas/CreditAmount'
          description: >-
            The quote's `total_ceiling_credits` as the caller read it. Sent,
            and disagreeing with the quote's own total, the API refuses the
            confirm with `409 expected_total_mismatch` before an enclosure
            is probed or a credit is reserved: a caller that has misread the
            price cannot spend it. Omitted, the confirm proceeds on the
            quote's recorded total alone.
    JobGroupMemberCounts:
      type: object
      additionalProperties: false
      required:
        - validating
        - queued
        - downloading
        - transcribing
        - merging
        - completed
        - failed
        - cancelled
        - cached_read
      description: >-
        How many members are in each job state, plus how many were settled
        cache reads (which have no state — they were delivered at confirm).
        The nine sum to `member_count` on a complete group.
      properties:
        validating: { type: integer, minimum: 0 }
        queued: { type: integer, minimum: 0 }
        downloading: { type: integer, minimum: 0 }
        transcribing: { type: integer, minimum: 0 }
        merging: { type: integer, minimum: 0 }
        completed: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        cancelled: { type: integer, minimum: 0 }
        cached_read: { type: integer, minimum: 0 }
    JobGroupJobMember:
      type: object
      additionalProperties: false
      required:
        [
          kind,
          job_id,
          episode_id,
          show_title,
          episode_title,
          status,
          estimated_credits,
          reserved_credits,
          created_at,
        ]
      description: >-
        A member with a job behind it. `reserved_credits` is the ceiling the
        confirm reserved; `settled_credits` and `released_credits` appear as
        the job's terminal state sets them, as on `JobStatus`. Poll or
        cancel the job itself through `/v1/transcripts/{job_id}`.
      properties:
        kind:
          const: job
        job_id:
          $ref: '#/components/schemas/JobId'
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        show_title:
          $ref: '#/components/schemas/JobShowTitle'
        episode_title:
          $ref: '#/components/schemas/JobEpisodeTitle'
        status:
          $ref: '#/components/schemas/JobState'
        estimated_credits:
          $ref: '#/components/schemas/CreditAmount'
        reserved_credits:
          $ref: '#/components/schemas/CreditAmount'
        settled_credits:
          $ref: '#/components/schemas/CreditAmount'
        released_credits:
          $ref: '#/components/schemas/CreditAmount'
        created_at:
          type: string
          format: date-time
    JobGroupCachedReadMember:
      type: object
      additionalProperties: false
      required: [kind, read_id, episode_id, show_title, episode_title, credits_charged, created_at]
      description: >-
        A member the confirm found already transcribed: charged
        `credits_charged` (the cached-read price for this account) at
        confirm, with no job
        behind it. `read_id` is the job-shaped id the read was charged under
        — the id its ledger event and access record carry — so every credit
        a group spent is explainable from the group alone, and it is the
        handle its transcript is fetched by: `GET /v1/reads/{read_id}`
        delivers it, in any format, and charges nothing further. The job
        poll cannot, because this member has no job.
      properties:
        kind:
          const: cached_read
        read_id:
          $ref: '#/components/schemas/JobId'
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        show_title:
          $ref: '#/components/schemas/JobShowTitle'
        episode_title:
          $ref: '#/components/schemas/JobEpisodeTitle'
        credits_charged:
          $ref: '#/components/schemas/CreditAmount'
        created_at:
          type: string
          format: date-time
    JobGroupMember:
      description: >-
        One member of a group — a job, or a settled cache read. `kind`
        discriminates.
      oneOf:
        - $ref: '#/components/schemas/JobGroupJobMember'
        - $ref: '#/components/schemas/JobGroupCachedReadMember'
    JobGroupResponse:
      type: object
      additionalProperties: false
      required:
        - group_id
        - status
        - quote_id
        - member_count
        - members
        - member_counts
        - credits_reserved
        - credits_settled
        - credits_released
        - created_at
        - completion_deadline
        - completed_at
        - abandoned_at
      description: >-
        One group's rollup. `member_count` is how many members the
        confirm set out to create; `members` is how many exist, which is
        fewer only while the group is `pending` (or after it was
        `abandoned` part way). `credits_reserved` is what the group still
        holds against the balance — the reservations of members not yet
        terminal; `credits_settled` is what it has been charged, job members
        and cache reads together; `credits_released` is what came back from
        members that failed, were cancelled, or settled below their ceiling.
        None of the three is a bill: each job member carries its own
        figures, and the ledger is the record.
      properties:
        group_id:
          $ref: '#/components/schemas/GroupId'
        status:
          $ref: '#/components/schemas/JobGroupStatus'
        quote_id:
          description: The quote this group confirmed, or `null` for a single-episode submission.
          anyOf:
            - $ref: '#/components/schemas/QuoteId'
            - enum: [null]
        member_count:
          type: integer
          minimum: 1
        members:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/JobGroupMember'
        member_counts:
          $ref: '#/components/schemas/JobGroupMemberCounts'
        credits_reserved:
          $ref: '#/components/schemas/CreditAmount'
        credits_settled:
          $ref: '#/components/schemas/CreditAmount'
        credits_released:
          $ref: '#/components/schemas/CreditAmount'
        created_at:
          type: string
          format: date-time
        completion_deadline:
          type: string
          format: date-time
          description: Past this, a still-`pending` group is swept.
        completed_at:
          $ref: '#/components/schemas/NullableDateTime'
        abandoned_at:
          $ref: '#/components/schemas/NullableDateTime'
    JobGroupSummary:
      type: object
      additionalProperties: false
      required: [group_id, status, quote_id, member_count, created_at, completed_at, abandoned_at]
      description: >-
        A group as it appears in a `GET /v1/groups` page: its identity,
        state, size, and timestamps, never its members — a page of a
        hundred groups must not cost a hundred member listings.
      properties:
        group_id:
          $ref: '#/components/schemas/GroupId'
        status:
          $ref: '#/components/schemas/JobGroupStatus'
        quote_id:
          anyOf:
            - $ref: '#/components/schemas/QuoteId'
            - enum: [null]
        member_count:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
        completed_at:
          $ref: '#/components/schemas/NullableDateTime'
        abandoned_at:
          $ref: '#/components/schemas/NullableDateTime'
    JobGroupsListResponse:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/JobGroupSummary'
        next_cursor:
          $ref: '#/components/schemas/NullableCursor'
    EpisodeSummary:
      type: object
      additionalProperties: false
      required:
        - episode_id
        - show_id
        - guid
        - title
        - published_at
        - publisher_transcript_available
        - is_cached
      description: >-
        Episode metadata, publisher-transcript presence, cache availability,
        and a credit estimate.


        **`is_cached` is `null` on a listing.** Knowing it requires the
        episode's asset revision, which is a network probe of the audio per
        episode — a cost a browse surface must not pay a hundred times over.
        `POST /v1/quotes` probes the handful of episodes it is actually
        pricing and reports the real answer there. A listing therefore says
        "not determined", never `false`, so a caller cannot read an
        unprobed episode as a known cache miss.
      properties:
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        show_id:
          $ref: '#/components/schemas/ShowId'
        guid:
          $ref: '#/components/schemas/EpisodeGuid'
        title:
          type: string
          minLength: 1
          maxLength: 500
        published_at:
          type: string
          format: date-time
        duration_sec:
          description: Feed-published duration if known, else `null`.
          anyOf:
            - type: number
              minimum: 0
              maximum: 129600
            - enum: [null]
        publisher_transcript_available:
          type: boolean
        is_cached:
          description: >-
            `true` or `false` where the surface probed the audio; `null` on a
            listing, which does not. See the note on this schema.
          anyOf:
            - type: boolean
            - enum: [null]
        estimated_credits:
          description: A credit estimate for transcribing this episode fresh, if not cached.
          anyOf:
            - $ref: '#/components/schemas/CreditAmount'
            - enum: [null]
    EpisodesListResponse:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/EpisodeSummary'
        next_cursor:
          $ref: '#/components/schemas/NullableCursor'
    ResolveResult:
      type: object
      additionalProperties: false
      required: [episode_id, show_id, is_cached]
      description: >-
        Resolves a pointer to canonical IDs without creating a job.
      properties:
        episode_id:
          $ref: '#/components/schemas/EpisodeId'
        show_id:
          $ref: '#/components/schemas/ShowId'
        is_cached:
          type: boolean
        estimated_credits:
          anyOf:
            - $ref: '#/components/schemas/CreditAmount'
            - enum: [null]
        quote_basis:
          anyOf:
            - $ref: '#/components/schemas/QuoteBasis'
            - enum: [null]
        estimated_seconds:
          description: >-
            Estimated wall-clock processing seconds, or `null` when the pointer
            resolved but nothing has been estimated yet (e.g. the episode is
            already cached, so no fresh work would be scheduled).
          anyOf:
            - $ref: '#/components/schemas/EstimatedProcessingSeconds'
            - enum: [null]
    # ---------------------------------------------------------------------
    # Account (docs/engineering/api-design.md §4.4, ADR-0020).
    # ---------------------------------------------------------------------
    Tier:
      type: string
      enum: [free, hobby, startup, growth, scale]
    AccountId:
      type: string
      pattern: '^acct_[A-Za-z0-9_-]{1,150}$'
      maxLength: 155
      description: >-
        The calling account's opaque identifier. Self-serve
        accounts derive it from the Cognito subject, so it is stable for the
        life of the account and identical however the account was created;
        operator-provisioned accounts predate that and carry arbitrary names
        within the same shape. Callers must not parse it or infer anything
        from its body.
    AccountStatus:
      type: string
      enum: [active, suspended, deleting, deleted]
      description: >-
        The account's own state. `active` is the only one that may spend:
        `suspended` is a billing or abuse hold, and `deleting`/`deleted` are a
        deletion in progress or complete. Reads stay open in every state until
        the account's API keys are revoked, which is when access actually
        ends — so a non-`active` status is a reason to show the customer their
        billing page, not a reason to sign them out.
    SessionResponse:
      type: object
      additionalProperties: false
      required: [account_id, tier, status]
      description: >-
        What one session carries. Deliberately no balance and no credit
        figure: a number frozen into a session outlives itself, and
        `GET /v1/usage` reads the live one.
      properties:
        account_id:
          $ref: '#/components/schemas/AccountId'
        tier:
          $ref: '#/components/schemas/Tier'
        status:
          $ref: '#/components/schemas/AccountStatus'
    DailyUsage:
      type: object
      additionalProperties: false
      required: [date, used_credits]
      description: One UTC calendar day of the reporting period, and what was settled in it.
      properties:
        date:
          type: string
          format: date
          description: >-
            A UTC calendar day. UTC and not the viewer's zone: every timestamp
            this system stores is UTC, and a local-zone series would move
            credits between days depending on who is looking at it.
        used_credits:
          $ref: '#/components/schemas/CreditAmount'
    UsageResponse:
      type: object
      additionalProperties: false
      required:
        - tier
        - balance_credits
        - reserved_credits
        - included_credits
        - additional_credits
        - period_start
        - period_end
        - period_used_credits
        - allowance_resets_at
        - daily
      description: >-
        What the account holds and what it has spent this period. See
        `GET /v1/usage` for what the period is while no subscription exists,
        and why `allowance_resets_at` is `null` on the free tier.
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        balance_credits:
          $ref: '#/components/schemas/CreditAmount'
        reserved_credits:
          $ref: '#/components/schemas/CreditAmount'
        included_credits:
          $ref: '#/components/schemas/CreditAmount'
        additional_credits:
          $ref: '#/components/schemas/CreditAmount'
        period_start:
          type: string
          format: date-time
        period_end:
          type: string
          format: date-time
        period_used_credits:
          $ref: '#/components/schemas/CreditAmount'
        allowance_resets_at:
          type: [string, 'null']
          format: date-time
          description: >-
            When the plan's included credits next refill. `null` when nothing
            refills them — the free tier's grant is issued once at signup, and
            there is no sweep that renews it.
        daily:
          type: array
          maxItems: 31
          description: >-
            The period's spend by day, from its first day through today,
            zero-filled and always summing to `period_used_credits`. It stops
            at today rather than running to `period_end`: a zero for a day
            that has not happened is not a fact.
          items:
            $ref: '#/components/schemas/DailyUsage'
    LimitsResponse:
      type: object
      additionalProperties: false
      required:
        - tier
        - requests_per_minute
        - concurrent_jobs
        - max_audio_duration_seconds
        - max_audio_size_bytes
      description: >-
        The caller's exact tier limits, published as real numbers, never
        "unlimited". `requests_per_minute`/`concurrent_jobs` per
        tier: free 10/1, hobby 60/2, startup 150/5, growth 400/8, scale
        1000/15. `concurrent_jobs` is published, not enforced: the one per-account job limit enforced today is the open-job cap — free 3, hobby 10, startup 30, growth 60, scale 100. The two audio ceilings are the
        pipeline's rather than the plan's, so they are the same on every tier.
      properties:
        tier:
          $ref: '#/components/schemas/Tier'
        requests_per_minute:
          type: integer
          minimum: 1
          maximum: 100000
        concurrent_jobs:
          type: integer
          minimum: 1
          maximum: 100000
        max_audio_duration_seconds:
          type: integer
          minimum: 1
          description: 'MVP podcast enclosure cap: 10 hours.'
        max_audio_size_bytes:
          type: integer
          minimum: 1
          description: 'MVP podcast enclosure cap: 5 GB.'
    AsrEngine:
      type: string
      enum: [qwen3-asr, whisper-large-v3-turbo, whisper-large-v3]
    SupportTier:
      type: string
      enum: [benchmarked, supported, best_effort]
    LanguageSupport:
      type: object
      additionalProperties: false
      required: [language, engine, support_tier, max_timing_precision]
      description: No diarization field at launch.
      properties:
        language:
          $ref: '#/components/schemas/Language'
        engine:
          $ref: '#/components/schemas/AsrEngine'
        support_tier:
          $ref: '#/components/schemas/SupportTier'
        max_timing_precision:
          $ref: '#/components/schemas/TimingPrecision'
    LanguagesResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/LanguageSupport'
    # ---------------------------------------------------------------------
    # Dashboard: API keys (docs/engineering/api-design.md §5).
    # ---------------------------------------------------------------------
    ApiKeyPrefix:
      type: string
      enum: [hk_live_, hk_test_]
    ApiKeyMode:
      type: string
      enum: [live, test]
    ApiKeySummary:
      type: object
      additionalProperties: false
      required: [key_id, label, prefix, mode, created_at, revoked]
      description: Key metadata only; never returns stored plaintext.
      properties:
        key_id:
          $ref: '#/components/schemas/KeyId'
        label:
          type: string
          minLength: 1
          maxLength: 100
        prefix:
          $ref: '#/components/schemas/ApiKeyPrefix'
        mode:
          $ref: '#/components/schemas/ApiKeyMode'
        created_at:
          type: string
          format: date-time
        last_used_at:
          $ref: '#/components/schemas/NullableDateTime'
        revoked:
          type: boolean
        revoked_at:
          $ref: '#/components/schemas/NullableDateTime'
    OAuthRequestId:
      type: string
      pattern: '^oar_[a-f0-9]{24}$'
      maxLength: 40
      description: A pending OAuth authorization request, as the consent page's URL carries it.
    GrantId:
      type: string
      pattern: '^oag_[a-f0-9]{24}$'
      maxLength: 40
      description: A connected app — one OAuth grant.
    OAuthRequestView:
      type: object
      additionalProperties: false
      required: [request_id, client, redirect, scope, scope_description, expires_at]
      properties:
        request_id:
          $ref: '#/components/schemas/OAuthRequestId'
        client:
          type: object
          additionalProperties: false
          required: [name, verified, client_id, kind]
          properties:
            name:
              type: string
              maxLength: 100
            verified:
              type: boolean
              description: >-
                Whether the name is vouched for by where the code goes or by
                the app's metadata document, rather than claimed.
            client_id:
              type: string
              maxLength: 2048
            kind:
              type: string
              enum: [metadata_document, registered]
        redirect:
          type: object
          additionalProperties: false
          required: [target, loopback]
          properties:
            target:
              type: string
              maxLength: 300
              description: The host (or, for a native app, the scheme) the code is sent to.
            loopback:
              type: boolean
              description: >-
                A redirect to this computer: any program on it could be the
                listener, which the consent page warns about.
        scope:
          type: string
          maxLength: 100
        scope_description:
          type: string
          maxLength: 300
        expires_at:
          type: string
          format: date-time
    OAuthDecisionRequest:
      type: object
      additionalProperties: false
      required: [approve]
      properties:
        approve:
          type: boolean
    OAuthDecision:
      type: object
      additionalProperties: false
      required: [redirect_to]
      properties:
        redirect_to:
          type: string
          format: uri
          maxLength: 4096
          description: >-
            The app's redirect, carrying `code`, `state` and `iss` on an
            approval, or `error=access_denied` on a refusal.
        grant_id:
          $ref: '#/components/schemas/GrantId'
    ConnectedApp:
      type: object
      additionalProperties: false
      required:
        [
          grant_id,
          client_name,
          verified,
          redirect_target,
          scope,
          created_at,
          last_used_at,
          revoked,
          revoked_at,
        ]
      properties:
        grant_id:
          $ref: '#/components/schemas/GrantId'
        client_name:
          type: string
          maxLength: 100
        verified:
          type: boolean
        redirect_target:
          type: string
          maxLength: 300
        scope:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
        last_used_at:
          $ref: '#/components/schemas/NullableDateTime'
        revoked:
          type: boolean
        revoked_at:
          $ref: '#/components/schemas/NullableDateTime'
    ConnectedAppsListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConnectedApp'
    ApiKeysListResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: array
          maxItems: 200
          items:
            $ref: '#/components/schemas/ApiKeySummary'
    RequestLogEntry:
      type: object
      additionalProperties: false
      required:
        [
          request_id,
          at,
          method,
          endpoint,
          status,
          duration_ms,
          credits_charged,
          charge_pending,
          error_code,
        ]
      properties:
        request_id:
          $ref: '#/components/schemas/RequestId'
        at:
          type: string
          format: date-time
          description: When the API finished handling the request.
        method:
          type: string
          enum: [GET, POST, PUT, PATCH, DELETE]
        endpoint:
          type: string
          maxLength: 200
          description: >-
            The route template the request matched, e.g.
            `/v1/episodes/{episode_id}/transcript` — not the path as called.
            A log entry names a route, never its contents: no identifier a
            caller passed, no query string, and no request body is recorded.
          example: /v1/episodes/{episode_id}/transcript
        status:
          type: integer
          minimum: 100
          maximum: 599
        duration_ms:
          type: integer
          minimum: 0
          description: How long the API took to answer, in milliseconds.
        credits_charged:
          $ref: '#/components/schemas/CreditAmount'
          description: >-
            Credits actually charged for this request so far. `0` for the
            requests that cost nothing, and for a submission whose work has not
            settled yet — see `charge_pending`.
        charge_pending:
          type: boolean
          description: >-
            `true` when this request started work that is charged as it lands,
            so `credits_charged` may still grow. `false` when the figure is
            final. A boolean rather than a credit amount, which is why it is
            not named `credits_*`.
        error_code:
          description: The error code the request was refused with, or `null` if it succeeded.
          anyOf:
            - $ref: '#/components/schemas/ErrorCode'
            - enum: [null]
    RequestLogOmission:
      type: object
      additionalProperties: false
      required: [reason, message]
      description: >-
        What this log does not contain, stated in every response including an
        empty one.
      properties:
        reason:
          type: string
          enum: [refused_at_the_edge]
        message:
          type: string
          maxLength: 600
    RequestLogListResponse:
      type: object
      additionalProperties: false
      required: [data, next_cursor, omitted]
      properties:
        data:
          type: array
          maxItems: 100
          description: Requests newest first.
          items:
            $ref: '#/components/schemas/RequestLogEntry'
        next_cursor:
          $ref: '#/components/schemas/NullableCursor'
        omitted:
          $ref: '#/components/schemas/RequestLogOmission'
    ApiKeyCreateRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '^[^\r\n]{1,100}$'
        mode:
          $ref: '#/components/schemas/ApiKeyMode'
          default: live
    ApiKeyCreateResponse:
      type: object
      additionalProperties: false
      required: [key_id, label, prefix, mode, created_at, revoked, secret]
      description: >-
        Same fields as `ApiKeySummary` plus the plaintext `secret`, shown
        exactly once. Duplicated rather than composed via
        `allOf` for the same reason documented on `TranscriptArtifact`.
      properties:
        key_id:
          $ref: '#/components/schemas/KeyId'
        label:
          type: string
          minLength: 1
          maxLength: 100
        prefix:
          $ref: '#/components/schemas/ApiKeyPrefix'
        mode:
          $ref: '#/components/schemas/ApiKeyMode'
        created_at:
          type: string
          format: date-time
        revoked:
          type: boolean
        secret:
          type: string
          minLength: 20
          maxLength: 200
          description: The plaintext secret. Shown exactly once; never retrievable again.
    # ---------------------------------------------------------------------
    # Dashboard: billing (docs/engineering/api-design.md §5, docs/engineering/technical-spec.md §9).
    # ---------------------------------------------------------------------
    PaidTier:
      type: string
      enum: [hobby, startup, growth, scale]
      description: >-
        A tier that is bought rather than granted — `Tier` minus `free`.
        Each of these has a monthly price behind a stable Stripe *lookup key*; the free tier has neither a product nor a price, because
        its allowance is the session bootstrap's one-time credit grant and
        there is nothing to check out.
    CheckoutRequest:
      type: object
      additionalProperties: false
      required: [tier]
      description: >-
        **A tier, never a price id.** A `price_…`
        identifier differs between Stripe's test and live modes and between
        environments, so one written into a request would be correct in exactly
        one of them. The price is resolved server-side from the tier's stable
        lookup key at the moment the session is created.


        It is also the safer half of the exchange. A caller-named price is a
        caller-named *amount*: any active price in the account would be
        accepted, including one belonging to a different product, so a customer
        could pay the cheapest plan's price and be checked out against any
        other. A tier names a row in a table only the server can read.
      properties:
        tier:
          $ref: '#/components/schemas/PaidTier'
    CheckoutResponse:
      type: object
      additionalProperties: false
      required: [checkout_url]
      properties:
        checkout_url:
          type: string
          format: uri
          maxLength: 2048
    PortalResponse:
      type: object
      additionalProperties: false
      required: [portal_url]
      properties:
        portal_url:
          type: string
          format: uri
          maxLength: 2048
    InvoiceStatus:
      type: string
      enum: [paid, open, void, uncollectible]
    Invoice:
      type: object
      additionalProperties: false
      required: [invoice_id, amount, currency, status, created_at]
      properties:
        invoice_id:
          type: string
          minLength: 1
          maxLength: 100
        amount:
          type: integer
          minimum: 0
          description: Minor currency units (e.g. cents).
        currency:
          type: string
          pattern: '^[a-z]{3}$'
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        created_at:
          type: string
          format: date-time
        hosted_invoice_url:
          $ref: '#/components/schemas/NullableUri'
    InvoicesListResponse:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Invoice'
        next_cursor:
          $ref: '#/components/schemas/NullableCursor'
    BillingAddress:
      type: object
      additionalProperties: false
      required: [line1, city, country]
      description: >-
        The postal address a subscription is billed to, in Stripe's own
        address field names so that what this account stores and what a
        Checkout session collects are the same shape rather than two that have
        to be mapped.


        **Only `line1`, `city` and `country` are required, and that is a
        deliberate refusal to over-validate.** A postal code is not universal
        (Ireland, Hong Kong and the UAE among others), and a state or province
        is meaningful in a minority of countries; requiring either would reject
        real addresses from real customers to gain nothing a payment processor
        has asked for. Stripe itself requires only the country.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Who the invoice is addressed to, when that is not the account holder's own name.
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
          description: State, province, or region, where the country has them.
        postal_code:
          type: string
          minLength: 1
          maxLength: 20
        country:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2, upper-case — the form Stripe stores and returns.
    BillingAddressResponse:
      type: object
      additionalProperties: false
      required: [address]
      description: >-
        The stored billing address, or `null` when this account has never saved
        one. `null` rather than a `404`: an account with no address is not a
        missing resource, it is an account whose settings form has an empty
        section, and answering `404` would make the page treat a normal state
        as an error.
      properties:
        address:
          anyOf:
            - $ref: '#/components/schemas/BillingAddress'
            - enum: [null]
    AutoRechargeResponse:
      type: object
      additionalProperties: false
      required:
        [
          available,
          enabled,
          threshold_credits,
          top_up_credits,
          top_up_amount_cents,
          currency,
          failure,
        ]
      description: >-
        Whether this account tops itself up, and the figures it would use. Every
        figure is `null` when `available` is false, which is the free tier: its
        grant is one-time and it has no price to charge.
      properties:
        available:
          type: boolean
          description: Whether this account's tier can auto-recharge at all.
        enabled:
          type: boolean
          description: Whether the customer has switched it on.
        threshold_credits:
          anyOf:
            - $ref: '#/components/schemas/CreditAmount'
            - enum: [null]
          description: >-
            The settled balance at which a top-up is triggered — a floor crossed
            downward, not a total spent. It is a tenth of the tier's included
            allowance.
        top_up_credits:
          anyOf:
            - $ref: '#/components/schemas/CreditAmount'
            - enum: [null]
          description: The credits a top-up adds — one more month of the tier's allowance.
        top_up_amount_cents:
          anyOf:
            - type: integer
              minimum: 0
            - enum: [null]
          description: What a top-up costs, in the currency's smallest unit.
        currency:
          anyOf:
            - type: string
            - enum: [null]
          description: ISO 4217 code for `top_up_amount_cents`.
        failure:
          description: >-
            The last decline, or `null`. A recorded failure pauses
            auto-recharge; switching it on again clears this.
          anyOf:
            - type: object
              additionalProperties: false
              required: [code, at]
              properties:
                code:
                  type: string
                  description: >-
                    The provider's decline code, and nothing beside it — the
                    message Stripe pairs with it quotes the card.
                at:
                  anyOf:
                    - type: string
                      format: date-time
                    - enum: [null]
            - enum: [null]
    RefundRequest:
      type: object
      additionalProperties: false
      required: [credit_lot_id]
      properties:
        credit_lot_id:
          type: string
          pattern: '^lot_[A-Za-z0-9_-]{6,64}$'
          maxLength: 80
    RefundStatus:
      type: string
      enum: [succeeded, pending, failed]
    RefundResponse:
      type: object
      additionalProperties: false
      required: [refund_id, credit_lot_id, refunded_credits, refunded_amount, currency, status]
      description: >-
        Refunds only unused, unexpired, refundable paid-credit lots, to
        their originating Stripe charge and currency. Free, promotional, and
        consumed credits are never cash-refunded.
      properties:
        refund_id:
          type: string
          minLength: 1
          maxLength: 100
        credit_lot_id:
          type: string
          pattern: '^lot_[A-Za-z0-9_-]{6,64}$'
          maxLength: 80
        refunded_credits:
          $ref: '#/components/schemas/CreditAmount'
        refunded_amount:
          type: integer
          minimum: 0
          description: Minor currency units (e.g. cents).
        currency:
          type: string
          pattern: '^[a-z]{3}$'
        status:
          $ref: '#/components/schemas/RefundStatus'
    # ---------------------------------------------------------------------
    # Dashboard: preferences (docs/engineering/api-design.md §5).
    # ---------------------------------------------------------------------
    # ---------------------------------------------------------------------
    # Dashboard: data export/deletion (docs/product/mvp-contract.md §6, docs/engineering/api-design.md §5).
    # ---------------------------------------------------------------------
    DataExportResponse:
      type: object
      additionalProperties: false
      required: [download_url, expires_at]
      properties:
        download_url:
          type: string
          format: uri
          maxLength: 2048
        expires_at:
          type: string
          format: date-time
    RetainedRecord:
      type: object
      additionalProperties: false
      required: [category, reason]
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 60
        reason:
          type: string
          minLength: 1
          maxLength: 300
        expires_at:
          $ref: '#/components/schemas/NullableDateTime'
    DataDeletionReceipt:
      type: object
      additionalProperties: false
      required: [removed_categories, retained_records, shared_cache_note]
      description: >-
        Lists removed categories, retained legal/fraud records with
        expiry/reason, and shared public-cache objects not deleted because
        they are not account-owned.
      properties:
        removed_categories:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 60
        retained_records:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/RetainedRecord'
        shared_cache_note:
          type: string
