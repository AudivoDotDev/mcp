  /v1/oauth/requests/{request_id}:
    get:
      operationId: getOAuthRequest
      tags: [Connected Apps]
      summary: Read a pending connection request
      security:
        - dashboardJwt: []
      description: >-
        What the consent page shows for an app asking to connect: the app,
        where its authorization code would be sent, and what the scope
        allows. Read back from the request the authorization endpoint
        recorded — nothing here comes from the page's own URL. `client.verified`
        is `true` only when something the app cannot forge (its metadata
        document's address, or its redirect's host) says who it is; otherwise
        `client.name` is the app's own claim. A request lives ten minutes and
        is consumed by its decision.
      parameters:
        - $ref: '#/components/parameters/OAuthRequestIdPathParam'
      responses:
        '200':
          description: The pending request.
          headers:
