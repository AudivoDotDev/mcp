openapi: 3.1.0
info:
  title: Audivo API
  version: '0.16.0'
  description: >-
    The Audivo API turns a public podcast episode into a clean, timed
    transcript. Name an episode by an Apple Podcasts link, by its RSS feed
    URL and GUID, by the episode id an earlier answer gave you, or by an
    upload of audio you hold; get back structured, timed text — at once for
    an episode already transcribed, or as a job you poll for fresh audio.
    One call does it: `POST /v1/transcripts`. Quotes are for pricing a
    selection of many episodes before confirming it.


    Two authentication schemes, and which an operation takes is part of what
    it is: `apiKeyBearer` — an `hk_live_` key sent as `Authorization: Bearer`
    — authenticates the public API, and `dashboardJwt` authenticates the
    dashboard's own operations. No operation that takes one accepts the other
    in its place. An API-key caller reads its balance and reservations from
    any quote response.


    The hosted MCP server at `/mcp` and the OAuth 2.1 endpoints that
    connect an assistant to it — `/.well-known/oauth-protected-resource`,
    `/.well-known/oauth-authorization-server`, and `/oauth/authorize`,
    `/oauth/token`, `/oauth/register`, `/oauth/revoke` — are protocol
    transports on the same host, not contract operations: an MCP client
    discovers and describes them from those two metadata documents (RFC
    9728, RFC 8414), and they are documented with the MCP server. Their
    access tokens are checked by the same authorizer as an API key and
    metered by the same plan; the consent they need is two dashboard
    operations below, under **Connected Apps**.


    Deferred on purpose, and absent from this document rather than hidden:
    webhooks, subscriptions, speaker labels beyond the frozen
    `diarized: false` shape, custom vocabulary, caller-selected engines,
    raw-audio URLs, SDKs, translation, and cross-corpus search.
    What changed in each version is on the documentation site's changelog.
  # Maintainers: the version history and design rationale that used to be
  # this description live in the repository's docs (ADRs, plans) and on the
  # changelog page; the description is customer-facing text only.
  license:
    name: Proprietary
    url: https://docs.audivo.dev/legal/terms
servers:
  # The custom domain maps an empty base path onto the deployed stage, so no
  # stage prefix belongs here; the /v1 prefix stays in the path keys.
  # OpenAPI concatenates the server URL with each path verbatim.
  - url: https://api.audivo.dev
    description: Production API. Append the operation path, including /v1.
tags:
  - name: Transcripts
    description: Create, poll, retrieve, and cancel transcription jobs.
  - name: Catalog
    description: >-
      Public podcast show/episode search, charts, detail, and resolution.
      Every metadata/search/list call in this tag costs 1 credit; no catalog response echoes
      `credits_charged`, so the charge is stated here rather than
      per-response. Not yet applied: the discovery operations shipped in
      0.2.0 (`GET /v1/search/shows`, `GET /v1/charts`) are metered by request
      rate only and write no credit-bearing row; the per-call charge lands
      with the catalog reads that bill.
  - name: Quotes
    description: >-
      Price a selection before spending. A quote resolves every episode in
      it, records what it resolved under a short TTL, and reserves nothing; the confirm that follows is the
      operation that spends, and it answers with a job group.
  - name: Groups
    description: >-
      The job group: what one confirm created.
      A group holds N ≥ 1 members, each a transcription job or a settled
      cache read; a single-episode `POST /v1/transcripts` is a group of one.
      A caller reads a group's rollup, lists their own groups newest first,
      and cancels a group, which cancels every member not yet started and
      releases each reservation exactly once.
  - name: Session
    description: >-
      Dashboard-JWT session establishment. One operation, called by the
      dashboard's backend-for-frontend whenever it turns a Cognito sign-in
      into a Audivo session, and the one place a caller who does not yet have
      an account is served.
  - name: Account
    description: Usage, limits, and supported languages for the calling account.
  - name: API Keys
    description: Dashboard-JWT key lifecycle management.
  - name: Connected Apps
    description: >-
      Dashboard-JWT consent for an assistant connecting to the MCP server
      through OAuth, and the account's connected apps, each revocable.
  - name: Billing
    description: Dashboard-JWT Stripe Checkout, Customer Portal, invoices, and refunds.
  - name: Data
    description: Dashboard-JWT portable export and account deletion.
  - name: Uploads
    description: Audio the caller puts in Audivo's bucket and names as a source (ADR-0031).
paths:
  /v1/transcripts:
    post:
      operationId: createTranscript
      tags: [Transcripts]
      summary: Create or attach to a transcription job, or get an instant result
      security:
        - apiKeyBearer: []
      description: >-
        The default way to transcribe one episode: one call, no quote first.
        Accepts exactly one of four input shapes (`url`, `feed_url` +
        `guid`, `episode_id`, or `upload_id`); supplying more than one, or
        fields from more than one shape, fails schema validation. Returns
        a synchronous result on a cache hit or publisher-transcript
        passthrough, or `202` with a job to poll on a miss. `dry_run: true` returns a quote and creates
        neither a job nor a reservation.


        **Spend cap.** `max_credits` is the most this call may take. It is
        compared with the job's reservation ceiling (the estimate plus 25%,
        the most a job can settle at) or, for a cached episode, with the
        cached-read price for this caller, before anything is reserved; a
        call that could take more is refused `422 max_credits_exceeded` with
        the figure in the message. The cap never lowers the reservation.
        A dry run with `max_credits` refuses exactly when the call would.


        **Every job belongs to a group.**
        A single-episode submission is a job group of one: the same
        submission sequence a quote's confirm fans out over N members, run
        once, so the two can never disagree. The accepted job carries its
        `group_id`, which `GET /v1/groups/{group_id}` and
        `POST /v1/groups/{group_id}/cancel` accept. An `Idempotency-Key`,
        when sent, is honoured at the group: a repeat returns the original
        job — or the original cached read — and charges nothing further; its `status` is then the job's current state. A repeat that
        arrives while the original is still running — its group begun, its
        member not yet landed — is `409 request_in_progress`: retry with
        the same key shortly, never a new one, which would start a second
        job for the same episode.


        **Uploads.** `upload_id` names a file the caller announced with
        `POST /v1/uploads` and PUT. It is verified exactly as a quote
        verifies one — this account's and unexpired, arrived, and matching
        the announced size and SHA-256 — and refused with its own code when
        it is not: `404 upload_not_found`, `409 upload_not_received`
        (retryable once the PUT lands), or `422 upload_mismatch`. It is
        priced from the declared duration.


        **Upload episodes.** `episode_id` may name an episode created from
        the caller's own upload; it resolves against the upload's stored
        revision, and an episode that resolves to another account's upload
        answers `404` before dry-run pricing or cache access runs. A cache
        miss still prices and reserves at the upload's declared-duration
        ceiling, and may subsequently fail `upload_missing` if the
        underlying object has since expired. A cached transcript stays
        readable after the source upload's `retained_until` passes.


        **Not yet served on this path (0.4.0).** `format` other than `json`
        is refused with `invalid_request` here — the read operations

        deliver the raw formats — and a cache hit above the inline limit
        is delivered by reference as `TranscriptRead.transcript_url`;
        `language` is accepted and recorded nowhere.


        **Delivery format.** `format: json` (or omitted) returns
        `application/json`. `format: text|srt|vtt|md` returns the raw
        artifact under its own media type (`text/plain`,
        `application/x-subrip`, `text/vtt`, `text/markdown`) — never a JSON
        wrapper around a string. Because a raw body has nowhere to put
        provenance, those responses carry it in headers instead:
        `X-Transcript-Episode-Id`, `X-Transcript-Source`,
        `X-Transcript-Timing-Precision`, and
        `X-Credits-Charged`. **The single content-type switch:** a payload
        over the ~5 MB inline limit returns `200 application/json` with
        `{ transcript_url, expires_at }` in *every* format — including the
        raw ones, whose declared media type therefore does not apply to
        that one case. A `202`, a dry-run quote, and
        every error are always `application/json` regardless of `format`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TranscriptCreateRequest'
            examples:
              byUrl:
                summary: Apple Podcasts episode URL
                value:
                  url: 'https://podcasts.apple.com/us/podcast/x/id123?i=456'
                  language: en
                  format: json
                  dry_run: false
              byFeedAndGuid:
                summary: RSS feed URL plus episode GUID
                value:
                  feed_url: 'https://example.com/feed.xml'
                  guid: episode-guid
                  language: null
              byEpisodeId:
                summary: Canonical episode_id
                value:
                  episode_id: ep_6cvvz2gskmrjfsze
                  format: vtt
              byUploadId:
                summary: An upload of the caller's own audio
                value:
                  upload_id: upl_x7Kq2mN9pR4sT6vW8yZ0aB1c
              withSpendCap:
                summary: Apple Podcasts episode URL, refused if it could take more than 40 credits
                value:
                  url: 'https://podcasts.apple.com/us/podcast/x/id123?i=456'
                  max_credits: 40
      responses:
        '200':
          description: >-
            A cache hit or publisher-transcript passthrough (charges
            `credits_charged`), or a dry-run quote (`dry_run: true`; creates
            no job or reservation). The media type follows `format`; see the
            operation description for the one documented switch back to
            `application/json`.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-Transcript-Episode-Id: { $ref: '#/components/headers/XTranscriptEpisodeId' }
            X-Transcript-Source: { $ref: '#/components/headers/XTranscriptSource' }
            X-Transcript-Timing-Precision:
              $ref: '#/components/headers/XTranscriptTimingPrecision'
            X-Credits-Charged: { $ref: '#/components/headers/XCreditsCharged' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TranscriptRead'
                  - $ref: '#/components/schemas/TranscriptQuote'
                  - $ref: '#/components/schemas/TranscriptUrlRef'
              examples:
                cacheHit:
                  $ref: '#/components/examples/CacheHitTranscript'
                publisherSourced:
                  $ref: '#/components/examples/PublisherSegmentTranscript'
                dryRunQuote:
                  $ref: '#/components/examples/DryRunQuote'
                oversizedArtifact:
                  $ref: '#/components/examples/OversizedArtifactRef'
            text/plain:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
            application/x-subrip:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
              examples:
                srt:
                  $ref: '#/components/examples/SrtArtifact'
            text/vtt:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
            text/markdown:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
        '202':
          description: >-
            Accepted for fresh work after supported-pointer resolution and an
            atomic quote-ceiling reservation. The job may
            sit in `validating` while a bounded enclosure probe completes.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptJobAccepted'
              examples:
                freshJobAccepted:
                  $ref: '#/components/examples/FreshJobAccepted'
                testModeJob:
                  $ref: '#/components/examples/TestModeJobAccepted'
        '400':
          $ref: '#/components/responses/BadRequestApiKey'
        '401':
          $ref: '#/components/responses/UnauthorizedApiKey'
        '402':
          $ref: '#/components/responses/PaymentRequiredApiKey'
        '404':
          $ref: '#/components/responses/NotFoundApiKey'
        '409':
          $ref: '#/components/responses/ConflictApiKeyIdempotency'
        '422':
          $ref: '#/components/responses/UnprocessableApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequestsApiKey'
        '451':
          $ref: '#/components/responses/ContentBlockedApiKey'
        '500':
          $ref: '#/components/responses/InternalErrorApiKey'
        '503':
          $ref: '#/components/responses/ServiceUnavailableApiKey'
  /v1/transcripts/{job_id}:
    get:
      operationId: getTranscriptJob
      tags: [Transcripts]
      summary: Poll job status, progress, and (once completed) the transcript
      security:
        - apiKeyBearer: []
      description: >-
        Polls a job. Unlike the synchronous create and episode-read
        operations, `format` has **no default** here — omitting it and
        passing `?format=json` are different requests. Without `?format=`
        the response is `application/json` status only: the job status
        object, and `artifact` is never present, regardless of `status`.
        `?format=json` must be given explicitly to also receive the
        transcript: the same status object, now carrying `artifact` once
        `status` is `completed` — `artifact` is never implied by `completed`
        alone, so a caller polling for state does not repeatedly ship a
        whole transcript (see `JobStatus`).


        **Delivery format.** `format: text|srt|vtt|md` on a
        `completed` job returns the raw artifact under its own media type
        (`text/plain`, `application/x-subrip`, `text/vtt`, `text/markdown`)
        rather than a JSON envelope, with provenance carried in headers —
        `X-Transcript-Episode-Id`, `X-Transcript-Source`, and
        `X-Transcript-Timing-Precision` — so every delivery format carries the same provenance. **The single content-type switch:** a payload over
        the ~5 MB inline limit returns `200 application/json` with
        `{ transcript_url, expires_at }` in *every* format, including the
        raw ones.


        A non-`json` `format` against a job that is **not** `completed` is
        `409 job_not_completed` — there is no artifact to render yet, and
        the answer is to keep polling with no `format` (or with
        `format=json`) until the job is terminal. It is not a reason to wrap
        the status object in a different media type.
      parameters:
        - $ref: '#/components/parameters/JobIdPathParam'
        - $ref: '#/components/parameters/PollFormatQueryParam'
      responses:
        '200':
          description: >-
            Job status — status only when `format` is omitted, `artifact`
            included when `status` is `completed` **and** `format=json` was
            explicitly requested — or the completed raw artifact
            (`format=text|srt|vtt|md`), or, for an oversized payload in any
            format, the `transcript_url` reference.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-Transcript-Episode-Id: { $ref: '#/components/headers/XTranscriptEpisodeId' }
            X-Transcript-Source: { $ref: '#/components/headers/XTranscriptSource' }
            X-Transcript-Timing-Precision:
              $ref: '#/components/headers/XTranscriptTimingPrecision'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/JobStatus'
                  - $ref: '#/components/schemas/TranscriptUrlRef'
              examples:
                terminalFailure:
                  $ref: '#/components/examples/TerminalFailure'
                inProgress:
                  $ref: '#/components/examples/JobInProgress'
                bareCompleted:
                  $ref: '#/components/examples/TestModeCompletedStatusOnly'
                completedWithArtifact:
                  $ref: '#/components/examples/TestModeCompleted'
                oversizedArtifact:
                  $ref: '#/components/examples/OversizedArtifactRef'
            text/plain:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
            application/x-subrip:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
              examples:
                srt:
                  $ref: '#/components/examples/SrtArtifact'
            text/vtt:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
            text/markdown:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
        '400':
          $ref: '#/components/responses/BadRequestApiKey'
        '401':
          $ref: '#/components/responses/UnauthorizedApiKey'
        '404':
          $ref: '#/components/responses/NotFoundApiKey'
        '409':
          $ref: '#/components/responses/ConflictApiKeyJobNotCompleted'
        '429':
          $ref: '#/components/responses/TooManyRequestsApiKey'
        '500':
          $ref: '#/components/responses/InternalErrorApiKey'
  /v1/episodes/{episode_id}/transcript:
    get:
      operationId: getEpisodeTranscript
      tags: [Transcripts]
      summary: Direct cached fetch of an episode's transcript
      security:
        - apiKeyBearer: []
      description: >-
        Fetches a compatible cached transcript for a canonical episode
        directly, without submitting a job. When no compatible cache object
        exists, returns an `EpisodeQuoteHint` — the same quote figures a dry
        run reports, but *without* `dry_run`, because this request was not a
        dry run — rather than creating a job. Call `POST /v1/transcripts` to
        actually create one.


        **Upload episodes.** `episode_id` may name an episode created from
        the caller's own upload; it resolves against the upload's stored
        revision, and an episode that resolves to another account's upload
        answers `404` before a quote hint is computed or cache access runs.
        A cached transcript stays readable after the source upload's
        `retained_until` passes.


        **Delivery format.** `format: json` (or omitted) returns
        `application/json`. `format: text|srt|vtt|md` returns the raw
        artifact under its own media type (`text/plain`,
        `application/x-subrip`, `text/vtt`, `text/markdown`), with
        provenance in the `X-Transcript-Episode-Id`, `X-Transcript-Source`,
        and `X-Transcript-Timing-Precision` headers and
        the charge in `X-Credits-Charged`. **The single content-type
        switch:** a payload over the ~5 MB inline limit returns
        `200 application/json` with `{ transcript_url, expires_at }` in
        *every* format. A quote hint — no cached
        transcript exists to render — is always `application/json`,
        whatever `format` asked for.
      parameters:
        - $ref: '#/components/parameters/EpisodeIdPathParam'
        - $ref: '#/components/parameters/FormatQueryParam'
      responses:
        '200':
          description: A cached transcript read, or a quote hint if none exists yet.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-Transcript-Episode-Id: { $ref: '#/components/headers/XTranscriptEpisodeId' }
            X-Transcript-Source: { $ref: '#/components/headers/XTranscriptSource' }
            X-Transcript-Timing-Precision:
              $ref: '#/components/headers/XTranscriptTimingPrecision'
            X-Credits-Charged: { $ref: '#/components/headers/XCreditsCharged' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TranscriptRead'
                  - $ref: '#/components/schemas/EpisodeQuoteHint'
                  - $ref: '#/components/schemas/TranscriptUrlRef'
              examples:
                cacheHit:
                  $ref: '#/components/examples/CacheHitTranscript'
                noCacheYet:
                  $ref: '#/components/examples/NoCacheQuoteHint'
                oversizedArtifact:
                  $ref: '#/components/examples/OversizedArtifactRef'
            text/plain:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
            application/x-subrip:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
              examples:
                srt:
                  $ref: '#/components/examples/SrtArtifact'
            text/vtt:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
            text/markdown:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
        '400':
          $ref: '#/components/responses/BadRequestApiKey'
        '401':
          $ref: '#/components/responses/UnauthorizedApiKey'
        '402':
          $ref: '#/components/responses/PaymentRequiredApiKey'
        '404':
          $ref: '#/components/responses/NotFoundApiKey'
        '409':
          $ref: '#/components/responses/ConflictApiKeyAccountState'
        '422':
          $ref: '#/components/responses/UnprocessableApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequestsApiKey'
        '500':
          $ref: '#/components/responses/InternalErrorApiKey'
  /v1/reads/{read_id}:
    get:
      operationId: getTranscriptRead
      tags: [Transcripts]
      summary: Re-read a transcript this account has already paid for
      security:
        - apiKeyBearer: []
      description: >-
        Serves the transcript behind a settled read, and **charges nothing**.
        `read_id` is the id a read was charged under: the `read_id` of a
        `cached_read` group member (`JobGroupCachedReadMember`), which a
        confirm creates and bills when the episode was already transcribed,
        or the `job_id` of a job that reached `completed`, which earns the
        same receipt when it settles. Either way the account has paid once;
        this operation is how it takes delivery, as many times as it needs
        to, without paying again.


        Without it a cache hit inside a confirmed group would be money spent
        on content with no retrieval path: a cache read creates no job, so
        `GET /v1/transcripts/{job_id}` cannot serve it, and
        `GET /v1/episodes/{episode_id}/transcript` charges a *new* read on
        every call.


        **Delivery format.** Identical to the episode read:
        `format: json` (or omitted) returns `application/json`;
        `format: text|srt|vtt|md` returns the raw artifact under its own
        media type (`text/plain`, `application/x-subrip`, `text/vtt`,
        `text/markdown`) with provenance in `X-Transcript-Episode-Id`,
        `X-Transcript-Source`, and `X-Transcript-Timing-Precision`; and a
        payload over the ~5 MB inline limit returns `200 application/json`
        with `{ transcript_url, expires_at }` in *every* format — the single
        content-type switch. `format` defaults to `json` here rather than
        having no default as it does on the job poll, because a receipt has
        no state to poll: there is nothing this operation could usefully
        answer *except* the transcript.


        `credits_charged` on the `TranscriptRead` envelope, and the
        `X-Credits-Charged` header on every format, are `0` on this
        operation — always, not merely usually. What the read cost is the
        `credits_charged` of its group member and the amount on its ledger
        event, both recorded when it settled.


        A `read_id` this account holds no receipt for answers
        `404 job_not_found`, whether it never existed, belongs to another
        account, or names a job that has not completed — one answer, as on
        the job poll, so the miss discloses nothing.
      parameters:
        - $ref: '#/components/parameters/ReadIdPathParam'
        - $ref: '#/components/parameters/FormatQueryParam'
      responses:
        '200':
          description: >-
            The paid transcript, inline for `format=json` under the inline
            limit, as a raw body for `text|srt|vtt|md`, or as a
            `transcript_url` reference for an oversized payload in any
            format. Never a charge.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
            X-Transcript-Episode-Id: { $ref: '#/components/headers/XTranscriptEpisodeId' }
            X-Transcript-Source: { $ref: '#/components/headers/XTranscriptSource' }
            X-Transcript-Timing-Precision:
              $ref: '#/components/headers/XTranscriptTimingPrecision'
            X-Credits-Charged: { $ref: '#/components/headers/XCreditsCharged' }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/TranscriptRead'
                  - $ref: '#/components/schemas/TranscriptUrlRef'
              examples:
                oversizedArtifact:
                  $ref: '#/components/examples/OversizedArtifactRef'
            text/plain:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
            application/x-subrip:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
              examples:
                srt:
                  $ref: '#/components/examples/SrtArtifact'
            text/vtt:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
            text/markdown:
              schema:
                $ref: '#/components/schemas/RawTranscriptArtifact'
        '400':
          $ref: '#/components/responses/BadRequestApiKey'
        '401':
          $ref: '#/components/responses/UnauthorizedApiKey'
        '404':
          $ref: '#/components/responses/NotFoundApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequestsApiKey'
        '500':
          $ref: '#/components/responses/InternalErrorApiKey'
  /v1/search/shows:
    get:
      operationId: searchShows
      tags: [Catalog]
      summary: Find shows by name
      security:
        - apiKeyBearer: []
      description: >-
        Free-text show search over Podcast Index: its exact-title search
        (`search/bytitle`) and its fuzzy term search (`search/byterm`) are
        issued together and merged, title hits first, each show once. The
        provider decides which shows match — no local fuzzy matcher — and the order is Audivo's, so the
        same name finds the same show every time: titles that
        match the query exactly come first, then titles that start with it,
        then titles that contain it as whole words, then the rest; within
        each of those, the show with the larger catalogue first, then a show
        with an Apple listing before one without, then the provider's own
        order. Titles are compared
        case-insensitively, ignoring punctuation and a leading "The", and a
        title is graded both whole and by the part before its subtitle
        (`Name: Subtitle`), taking the better.
        Every entry carries `music_led`
        and the basis for it: a music-led show the caller searched for
        by name is *marked*, never removed, because they named it; the
        boundary is applied when a chart-derived selection is quoted
        (`POST /v1/quotes`). A provider entry that carries no feed URL cannot
        be selected or identified
        and is reported in `excluded` rather than dropped.


        The provider does not page this call, so `next_cursor` is always
        `null` and no cursor parameter is accepted; `limit` is how many
        entries come back. The provider is asked for at least twenty so the
        ranking has something to choose from.
      parameters:
        - $ref: '#/components/parameters/SearchQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: The matching shows, ranked as described above.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShowSearchResponse'
              examples:
                results:
                  $ref: '#/components/examples/ShowSearchPage'
        '400':
          $ref: '#/components/responses/BadRequestApiKey'
        '401':
          $ref: '#/components/responses/UnauthorizedApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequestsApiKey'
        '500':
          $ref: '#/components/responses/InternalErrorApiKey'
        '503':
          $ref: '#/components/responses/DiscoveryUnavailableApiKey'
  /v1/charts:
    get:
      operationId: getChart
      tags: [Catalog]
      summary: A category chart of a chosen size, capped by tier
      security:
        - apiKeyBearer: []
      description: >-
        The provider's chart for one category, of the size the caller asks for,
        clamped to the account tier's chart cap.
        The clamp is applied *before* the provider is called and is always
        reported in `size`, whether or not it bit: `requested` is what the
        caller asked for, `allowed` is what the tier permitted, `limit` is the
        tier's ceiling. Entries are marked `music_led` but not removed —
        a chart is only a list until `POST /v1/quotes` turns it into a
        selection, and that is where the music boundary applies by default.
      parameters:
        - $ref: '#/components/parameters/ChartCategoryQueryParam'
        - $ref: '#/components/parameters/ChartSizeQueryParam'
        - $ref: '#/components/parameters/ChartLanguageQueryParam'
      responses:
        '200':
          description: The chart, in provider order, with the size clamp reported.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChartResponse'
              examples:
                clampedForFree:
                  $ref: '#/components/examples/ChartExample'
        '400':
          $ref: '#/components/responses/BadRequestApiKey'
        '401':
          $ref: '#/components/responses/UnauthorizedApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequestsApiKey'
        '500':
          $ref: '#/components/responses/InternalErrorApiKey'
        '503':
          $ref: '#/components/responses/DiscoveryUnavailableApiKey'
  /v1/quotes:
    post:
      operationId: createQuote
      tags: [Quotes]
      summary: Price a selection without spending
      security:
        - apiKeyBearer: []
      description: >-
        Turns a chart or a list of named shows into a priced selection and
        records it.
        **Reserves nothing**: the quote holds no credit and creates no job; a
        separate confirm operation, keyed on `quote_id`, is what spends.


        **The selection rule, stated once.** Each show contributes
        either the episodes named in its `episode_ids`, or — when none are
        named — its newest `episodes_per_show` (default 1). Two tier bounds
        apply: the chart size, and the total number of episodes one selection
        may come to. No show may give more than that total on its own, which is the only thing that bounds depth: how far back a selection reaches is the caller's to state, not the plan's to grant. Every bound that bit is
        reported in `clamps`; every show and every episode that did not make
        it into `entries` is reported in `excluded` with a reason a caller can
        read. Nothing shrinks silently.


        **Three request shapes.** `chart` asks the provider for a category
        chart (clamped exactly as `GET /v1/charts` clamps it) and, because
        nobody chose those shows, excludes music-led ones unless
        `include_music_led` is `true`. `shows` names feed URLs — usually
        straight from a search result — and takes every one as chosen; no
        category data is consulted for a named show. `uploads` names files
        the caller announced and sent with `POST /v1/uploads`; each is
        verified with one object head and priced from its declared
        duration.


        **One feed fetch per show.** The feeds read to select episodes are
        the ones the quote prices from; nothing is downloaded twice. Each
        phase runs under its own wall-clock budget inside the request, and an
        episode the budget did not reach comes back in `excluded` as
        `budget_exceeded` rather than failing the request.


        Every priced entry carries the domain's estimate and its ceiling; a cached entry is
        priced at what a cached read costs *this* account — the floor for the
        account whose job produced the transcript, a fraction of its measured
        audio minutes for anyone else — with no ceiling above it.
        `remaining_open_jobs`
        is the caller's fan-out headroom under their tier's open-job cap — jobs
        reserved and not yet terminal — reported so a
        selection can be sized before spending. It is enforced at confirm, not
        here. `balance_credits` and `reserved_credits` ride beside it off the
        same account row, so an agent sees what it holds at the moment it
        decides to spend; they are reported on the same terms, and a
        balance too small for `total_ceiling_credits` does not refuse the
        quote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            examples:
              fromChart:
                $ref: '#/components/examples/QuoteFromChartRequest'
              fromShows:
                $ref: '#/components/examples/QuoteFromShowsRequest'
              fromUploads:
                $ref: '#/components/examples/QuoteFromUploadsRequest'
      responses:
        '200':
          description: The recorded quote — priced entries, exclusions, clamps, totals, and headroom.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
              examples:
                quote:
                  $ref: '#/components/examples/QuoteExample'
        '400':
          $ref: '#/components/responses/BadRequestApiKey'
        '401':
          $ref: '#/components/responses/UnauthorizedApiKey'
        '422':
          $ref: '#/components/responses/NothingToQuoteApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequestsApiKey'
        '500':
          $ref: '#/components/responses/InternalErrorApiKey'
        '503':
          $ref: '#/components/responses/DiscoveryUnavailableApiKey'
  /v1/uploads:
    post:
      operationId: createUpload
      tags: [Uploads]
      summary: Announce a file to upload
      security:
        - apiKeyBearer: []
      description: >-
        Records what the caller knows about an audio file and returns a
        presigned PUT for it. The URL is signed against the declared SHA-256,
        so S3 refuses a body whose hash differs; the API never reads the
        bytes. Send the file with exactly the `put_headers` returned. Then
        transcribe it with `POST /v1/transcripts` and `{ "upload_id": … }`,
        or name it in a quote as `uploads: [{ upload_id }]` alongside
        others.

        The upload is private to the account: its transcript is cached for
        this account alone. The upload becomes unavailable at
        `retained_until`; a quote after that reports `upload_not_found`. Physical object and record cleanup
        is asynchronous. Each account may announce at most 10 GiB across
        100 unexpired uploads. Announcements reserve this allowance even
        if no file is sent; capacity returns at their logical expiry.
        A refusal returns `429 upload_quota_exceeded` before a PUT URL is issued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
            examples:
              default:
                $ref: '#/components/examples/CreateUploadRequestExample'
      responses:
        '201':
          description: The upload is recorded; PUT the file next.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCreated'
              examples:
                default:
                  $ref: '#/components/examples/UploadCreatedExample'
        '400':
          $ref: '#/components/responses/BadRequestApiKey'
        '401':
          $ref: '#/components/responses/UnauthorizedApiKey'
        '409':
          $ref: '#/components/responses/ConflictApiKeyUploadAccountState'
        '429':
          $ref: '#/components/responses/TooManyRequestsApiKey'
        '500':
          $ref: '#/components/responses/InternalErrorApiKey'
  /v1/quotes/{quote_id}/confirm:
    post:
      operationId: confirmQuote
      tags: [Quotes]
      summary: Spend what a quote priced, as one job group
      security:
        - apiKeyBearer: []
      description: >-
        Turns a recorded quote into a job group: one member per quoted entry, each either a
        transcription job reserved at the entry's ceiling or, for an entry
        priced as cached, a settled read at the price the quote gave it. This
        is the operation that spends.


        **Every guard runs before the first credit moves.** The quote must
        be the caller's own and unexpired (`quote_not_found`,
        `quote_expired`); an `expected_total_credits` in the body must
        agree with the quote's recorded `total_ceiling_credits`, checked
        before anything is probed (`expected_total_mismatch`); every
        entry's enclosure is re-probed and a republished one refuses the
        whole confirm naming the episode (`quote_mismatch` — take a new
        quote), while entries the probe budget did not reach refuse it
        unverified (`quote_unverified` — send the same confirm again); the
        group's job-bearing
        members are checked once against the tier's open-job cap
        (`concurrency_limited`, naming the cap and the room left) and the
        whole group's ceiling against the balance (`payment_required`). A
        refusal here writes nothing at all.


        **`Idempotency-Key` is required.** The group is created under
        it before any member is reserved, so a repeat with the same key and
        body returns the original group — whatever state it is in — with
        `200` and charges nothing further. The same key with a different
        body is `409 idempotency_conflict`.


        **A confirm that dies half way is recoverable without you.** The
        group is written `pending` first and marked `complete` only when
        every member has landed; a group still pending past its
        `completion_deadline` is swept — its reservations returned, its
        status `abandoned`. Reading the group tells you which.
      parameters:
        - $ref: '#/components/parameters/QuoteIdPathParam'
        - $ref: '#/components/parameters/RequiredIdempotencyKeyHeader'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmRequest'
            examples:
              empty:
                summary: Nothing to say — the quote id is in the path
                value: {}
              fenced:
                summary: The quote's total restated, which the API refuses to spend past
                value: { expected_total_credits: 232 }
      responses:
        '200':
          description: >-
            The job group this confirm created, complete, with every member
            named — or, on a repeat under the same `Idempotency-Key`, the
            original group as it stands.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobGroupResponse'
              examples:
                confirmed:
                  $ref: '#/components/examples/ConfirmedGroup'
        '400':
          $ref: '#/components/responses/BadRequestApiKey'
        '401':
          $ref: '#/components/responses/UnauthorizedApiKey'
        '402':
          $ref: '#/components/responses/PaymentRequiredApiKey'
        '404':
          $ref: '#/components/responses/QuoteNotFoundApiKey'
        '409':
          $ref: '#/components/responses/ConflictApiKeyConfirm'
        '429':
          $ref: '#/components/responses/TooManyRequestsApiKey'
        '500':
          $ref: '#/components/responses/InternalErrorApiKey'
  /v1/groups:
    get:
      operationId: listGroups
      tags: [Groups]
      summary: List the caller's job groups, newest first
      security:
        - apiKeyBearer: []
      description: >-
        The caller's own groups and nobody else's, newest first. A
        summary per group — its status, size, and timestamps — never its
        members: read a group for those. `limit` bounds the page; there is
        no cursor in 0.3.0 (`next_cursor` is always `null`), so a caller with
        more history than one page sees its newest `limit` groups.
      parameters:
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
