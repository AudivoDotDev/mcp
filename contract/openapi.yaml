  /v1/oauth/requests/{request_id}/decision:
    post:
      operationId: decideOAuthRequest
      tags: [Connected Apps]
      summary: Approve or decline a connection request
      security:
        - dashboardJwt: []
      description: >-
        The signed-in account holder's answer. Approving connects the app to
        this account: a one-use authorization code and the connection
        (`grant_id`) are created and the request consumed in one write, and
        `redirect_to` is the app's redirect carrying `code`, `state`, and
        `iss`. Declining consumes the request and `redirect_to` carries
        `error=access_denied`. The caller sends the browser to `redirect_to`;
        this API never redirects. A request approved twice connects once.
      parameters:
        - $ref: '#/components/parameters/OAuthRequestIdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthDecisionRequest'
      responses:
        '200':
          description: Where to send the browser.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthDecision'
        '400':
          $ref: '#/components/responses/BadRequestDashboard'
        '401':
          $ref: '#/components/responses/UnauthorizedDashboard'
        '404':
          $ref: '#/components/responses/NotFoundDashboard'
