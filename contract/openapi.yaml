        '429':
          $ref: '#/components/responses/TooManyRequestsApiKey'
        '500':
          $ref: '#/components/responses/InternalErrorApiKey'
  /v1/session:
    post:
      operationId: establishSession
      tags: [Session]
      summary: Establish the signed-in user's Audivo session
      security:
        - dashboardJwt: []
      description: >-
        Resolves the access token's Cognito subject to a Audivo account,
        creating the account and its one free credit grant if no row exists
        yet, and answers with the identity a session then carries.


        **Idempotent by construction, not by convention.** The account id is
        derived from the Cognito subject, so calling this once, twice, or
        concurrently converges on the same account; a second call issues no
        second free grant, and neither does signing up again with an address
        that has already had one. Callers are expected to call it on *every*
        session establishment rather than only on first sign-in — it is the
        repair path for a signup whose account row was never written, and a
        caller that only called it once would never take it.


        It takes no request body. Everything it acts on comes from the
        verified token, so there is nothing a caller can send that changes
        which account it resolves — including the address the one-free-grant
        check is keyed on, which is read from the identity provider and never
        from the request.


        A non-`active` account is returned with its status rather than being
        replaced or refused: a suspended customer needs the billing page that
        lifts the hold, and answering `401` would take it away.
      responses:
        '200':
          description: The account this session acts for.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
          content:
            application/json:
              schema:
