  /v1/groups/{group_id}:
    get:
      operationId: getGroup
      tags: [Groups]
      summary: Read one job group's rollup
      security:
        - apiKeyBearer: []
      description: >-
        One request for the whole group: member counts by state, the
        credits it holds reserved and has settled and released, and every
        member — each job with its id and state, each cached read with the
        id it was charged under. Only for a group the caller's own account
        owns: another account's group id answers `404 group_not_found`, and
        discloses no member identifier (the account is the partition the
        group and its members are keyed under, not a filter).


        A `pending` group is a confirm still fanning out, or one that died;
        its members are the ones reserved so far. Past `completion_deadline`
        it is swept to `abandoned` with its reservations returned.
      parameters:
        - $ref: '#/components/parameters/GroupIdPathParam'
      responses:
        '200':
          description: The group and its members.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobGroupResponse'
              examples:
                inProgress:
                  $ref: '#/components/examples/GroupInProgress'
        '400':
          $ref: '#/components/responses/BadRequestApiKey'
        '401':
          $ref: '#/components/responses/UnauthorizedApiKey'
        '404':
          $ref: '#/components/responses/GroupNotFoundApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequestsApiKey'
        '500':
          $ref: '#/components/responses/InternalErrorApiKey'
  /v1/groups/{group_id}/cancel:
    post:
      operationId: cancelGroup
      tags: [Groups]
      summary: Cancel a group's members that have not started
      security:
        - apiKeyBearer: []
      description: >-
        Cancels every member still `validating` or `queued` and releases
        each one's reservation exactly once; a member a worker already
        owns is left to run and to settle or release on its own, exactly as
        `DELETE /v1/transcripts/{job_id}` leaves a claimed job. Idempotent: a
        repeat finds nothing left to cancel, releases nothing, and answers
        with the same rollup. The group's own status does not change — a
        cancelled group is a `complete` group whose members read
        `cancelled`.
      parameters:
        - $ref: '#/components/parameters/GroupIdPathParam'
      responses:
        '200':
          description: The group after the cancel, with every member's state.
          headers:
            X-Request-Id: { $ref: '#/components/headers/XRequestId' }
            X-RateLimit-Limit: { $ref: '#/components/headers/XRateLimitLimit' }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobGroupResponse'
              examples:
                cancelled:
                  $ref: '#/components/examples/CancelledGroup'
        '400':
          $ref: '#/components/responses/BadRequestApiKey'
        '401':
          $ref: '#/components/responses/UnauthorizedApiKey'
        '404':
          $ref: '#/components/responses/GroupNotFoundApiKey'
        '429':
          $ref: '#/components/responses/TooManyRequestsApiKey'
        '500':
          $ref: '#/components/responses/InternalErrorApiKey'
