# Publishes the package when a version tag is pushed. Uses npm trusted
# publishing (OIDC), so no npm token is stored anywhere: the package's
# settings on npmjs.com name this repository and this workflow file as the
# publisher, and npm mints a short-lived credential per run.
#
# Release steps: bump `version` in package.json, add the CHANGELOG entry,
# commit, then `git tag v<version> && git push --tags`.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - name: The tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} but package.json says $version"; exit 1; }
      # prepublishOnly runs typecheck, lint, format:check, test, and build.
      - run: npm publish --access public --provenance
