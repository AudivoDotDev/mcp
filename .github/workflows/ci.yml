name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - name: The binary refuses to start without a key
        run: |
          set +e
          out=$(node dist/bin.js 2>&1)
          status=$?
          set -e
          echo "$out"
          test "$status" -eq 1
          echo "$out" | grep -q AUDIVO_API_KEY
